<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2EC4E6">
    <title>Admin Click & Go Taxi</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <style>
        :root {
            --cyan: #2EC4E6;
            --cyan-dark: #1A9CB8;
            --yellow: #FFC107;
            --green: #28a745;
            --red: #dc3545;
            --purple: #6f42c1;
            --dark: #0b0b0b;
            --card: #121a1f;
            --border: #2a3a45;
            --text: #ffffff;
            --muted: #9aadb8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 40px;
        }
        .top {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            text-align: center;
        }
        .top h1 {
            font-size: 20px;
            color: var(--cyan);
            margin-bottom: 6px;
        }
        #estadoSistema {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .btn {
            display: inline-block;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin: 3px 2px;
            text-align: center;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-corte { background: var(--purple); color: #fff; width: 100%; padding: 16px; font-size: 15px; margin-bottom: 10px; }
        .btn-reporte { background: var(--cyan); color: #0b0b0b; width: 100%; padding: 16px; font-size: 15px; margin-bottom: 10px; }
        .btn-semana { background: #333; color: #fff; border: 1px solid var(--border); width: 100%; padding: 16px; font-size: 15px; margin-bottom: 10px; }
        .btn-active { background: var(--green); color: #fff; }
        .btn-block { background: var(--red); color: #fff; }
        .btn-reset { background: #0d6efd; color: #fff; }
        .btn-danger { background: #a71d2a; color: #fff; }
        .btn-info { background: var(--cyan-dark); color: #fff; }
        .buscador {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid var(--cyan);
            background: #152028;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        /* ===== BOTONES DE FILTRO CON COLORES ===== */
        .filtros {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            justify-content: center;
        }
        .filtro-btn {
            padding: 10px 16px;
            border-radius: 20px;
            border: 2px solid transparent;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.75;
        }
        .filtro-btn:active { transform: scale(0.96); }
        
        /* Todos - Blanco */
        .filtro-btn[data-filtro="todos"] {
            background: #ffffff;
            color: #0b0b0b;
            border-color: #ffffff;
        }
        .filtro-btn[data-filtro="todos"].activo {
            opacity: 1;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.35);
        }
        
        /* Pendientes - Amarillo */
        .filtro-btn[data-filtro="pendiente"] {
            background: #FFC107;
            color: #0b0b0b;
            border-color: #FFC107;
        }
        .filtro-btn[data-filtro="pendiente"].activo {
            opacity: 1;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.4);
        }
        
        /* Activos - Verde */
        .filtro-btn[data-filtro="activo"] {
            background: #28a745;
            color: #ffffff;
            border-color: #28a745;
        }
        .filtro-btn[data-filtro="activo"].activo {
            opacity: 1;
            box-shadow: 0 0 0 3px rgba(40,167,69,0.4);
        }
        
        /* Bloqueados - Rojo */
        .filtro-btn[data-filtro="bloqueado"] {
            background: #dc3545;
            color: #ffffff;
            border-color: #dc3545;
        }
        .filtro-btn[data-filtro="bloqueado"].activo {
            opacity: 1;
            box-shadow: 0 0 0 3px rgba(220,53,69,0.4);
        }

        #contadorResultados {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 10px;
            text-align: center;
        }

        /* ===== TABLA ESTILO BASE DE DATOS ===== */
        .table-wrap {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-top: 6px;
        }
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 780px;
        }
        thead {
            background: #0d1418;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th {
            padding: 14px 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 800;
            color: var(--cyan);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 14px 12px;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tbody tr:hover {
            background: rgba(46, 196, 230, 0.06);
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        .nombre-cell {
            font-weight: 700;
            color: #fff;
        }
        .tel-cell {
            color: var(--cyan);
            font-weight: 600;
        }
        .email-cell {
            color: var(--muted);
            font-size: 12px;
        }
        .badge {
            font-size: 11px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 20px;
            white-space: nowrap;
            display: inline-block;
        }
        .badge-activo { background: rgba(40,167,69,0.2); color: #28a745; }
        .badge-bloqueado { background: rgba(220,53,69,0.2); color: #dc3545; }
        .badge-pendiente { background: rgba(255,193,7,0.2); color: #ffc107; }
        .deuda {
            color: var(--yellow);
            font-weight: 700;
        }
        .acciones-cell {
            white-space: nowrap;
        }
        .fotos-ok {
            font-size: 12px;
            color: var(--muted);
        }
        .empty {
            text-align: center;
            color: var(--muted);
            padding: 40px 10px;
            font-size: 14px;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.75);
            align-items: flex-end;
            justify-content: center;
        }
        .modal.open { display: flex; }
        .modal-sheet {
            background: #152028;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            overflow-y: auto;
            border-top: 3px solid var(--cyan);
        }
        .modal-sheet h3 { color: var(--cyan); margin-bottom: 12px; font-size: 18px; }
        .close-btn {
            float: right;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            padding: 0 6px;
        }
        .comentario {
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            font-size: 14px;
        }
        .comentario .stars { color: var(--yellow); font-weight: 800; }
        .comentario .fecha { font-size: 11px; color: var(--muted); }
        /* LOGIN ADMIN */
        #pantallaLogin {
            position: fixed; inset: 0; z-index: 10000;
            background: #0b0b0b;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        #pantallaLogin.oculto { display: none; }
        .login-box {
            width: 100%; max-width: 360px;
            background: #121a1f;
            border: 1px solid #2a3a45;
            border-radius: 18px;
            padding: 24px 20px;
            text-align: center;
        }
        .login-box h2 { color: #2EC4E6; margin-bottom: 6px; font-size: 22px; }
        .login-box p { color: #9aadb8; font-size: 13px; margin-bottom: 18px; }
        .login-box input {
            width: 100%; padding: 14px; margin-bottom: 12px;
            border-radius: 12px; border: 1px solid #2a3a45;
            background: #152028; color: #fff; font-size: 16px;
        }
        .login-box .btn-login {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: #FFC107; color: #0b0b0b; font-weight: 800; font-size: 16px;
            cursor: pointer; margin-top: 4px;
        }
        #appAdmin { display: none; }
        #appAdmin.visible { display: block; }
        .btn-logout {
            background: transparent; border: 1px solid #2a3a45; color: #9aadb8;
            padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 700;
            width: 100%; margin-top: 8px; cursor: pointer;
        }
        /* Modal de fotos */
        .foto-controls {
            background: #0d1418;
            border-radius: 12px;
            padding: 14px;
            margin: 10px 0;
            border: 1px dashed var(--border);
        }
        .foto-controls label {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .foto-controls input[type="file"] {
            width: 100%;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<div id="pantallaLogin">
    <div class="login-box">
        <h2>🔒 Admin Click & Go</h2>
        <p>Solo acceso autorizado</p>
        <input type="text" id="adminUser" placeholder="Usuario" autocomplete="username">
        <input type="password" id="adminPass" placeholder="Contraseña" autocomplete="current-password">
        <button class="btn-login" onclick="loginAdmin()">ENTRAR</button>
        <p id="loginError" style="color:#dc3545; margin-top:12px; font-size:13px; display:none;"></p>
    </div>
</div>
<div id="appAdmin">
    <div class="top">
        <h1>🚕 Admin Click & Go</h1>
        <div id="adminNombreTop" style="font-size:13px;color:#9aadb8;margin-bottom:8px;"></div>
        <div id="estadoSistema">Verificando ciclo diario...</div>
        <button class="btn btn-corte" onclick="corteDiario()">🌙 CORTE DIARIO MANUAL</button>
        <button class="btn btn-reporte" onclick="window.open('admin_reporte_diario.html', '_blank')">📊 REPORTE DIARIO</button>
        <button class="btn btn-semana" onclick="cierreSemanal()">🔄 RESETEO SEMANAL</button>
        
        <input type="text" id="buscador" class="buscador" onkeyup="aplicarFiltros()" placeholder="🔍 Buscar por teléfono, correo o nombre...">
        
        <!-- BOTONES DE FILTRO CON COLORES -->
        <div class="filtros">
            <button class="filtro-btn activo" data-filtro="todos" onclick="setFiltro('todos')">Todos</button>
            <button class="filtro-btn" data-filtro="pendiente" onclick="setFiltro('pendiente')">Pendientes</button>
            <button class="filtro-btn" data-filtro="activo" onclick="setFiltro('activo')">Activos</button>
            <button class="filtro-btn" data-filtro="bloqueado" onclick="setFiltro('bloqueado')">Bloqueados</button>
        </div>
        
        <div id="contadorResultados">Cargando...</div>
        
        <button type="button" class="btn-logout" onclick="logoutAdmin()">🚪 Cerrar sesión</button>
    </div>

    <!-- TABLA TIPO BASE DE DATOS -->
    <div class="table-wrap">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Estado</th>
                        <th>Deuda</th>
                        <th>Rating</th>
                        <th>Fotos</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-conductores">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Comentarios -->
    <div id="modalComentarios" class="modal" onclick="if(event.target===this)cerrarModal()">
        <div class="modal-sheet">
            <button class="close-btn" onclick="cerrarModal()">&times;</button>
            <h3>Comentarios</h3>
            <div id="lista-detallada"></div>
        </div>
    </div>

    <!-- Modal Fotos -->
    <div id="modalFotos" class="modal" onclick="if(event.target===this)cerrarModalFotos()">
        <div class="modal-sheet">
            <button class="close-btn" onclick="cerrarModalFotos()">&times;</button>
            <h3>Fotos del conductor</h3>
            <div id="contenidoFotos"></div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD1c5lxn2ehGS_Wo5Htbkwi0gUcdpauiMg",
        databaseURL: "https://preetytaxiapp-default-rtdb.firebaseio.com/",
        storageBucket: "preetytaxiapp.firebasestorage.app"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    let filtroActual = 'todos';
    let totalConductores = 0;

    function setFiltro(filtro) {
        filtroActual = filtro;
        document.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.classList.remove('activo');
            if (btn.getAttribute('data-filtro') === filtro) {
                btn.classList.add('activo');
            }
        });
        aplicarFiltros();
    }

    function aplicarFiltros() {
        const q = (document.getElementById('buscador').value || '').toLowerCase().trim();
        let visibles = 0;
        
        document.querySelectorAll('.driver-row').forEach(row => {
            const texto = (row.getAttribute('data-search') || '').toLowerCase();
            const estado = (row.getAttribute('data-estado') || '').toLowerCase();
            
            const coincideTexto = !q || texto.includes(q);
            const coincideEstado = filtroActual === 'todos' || estado === filtroActual;
            
            if (coincideTexto && coincideEstado) {
                row.style.display = '';
                visibles++;
            } else {
                row.style.display = 'none';
            }
        });
        
        document.getElementById('contadorResultados').textContent = 
            visibles + ' conductores' + (filtroActual !== 'todos' ? ' · ' + filtroActual : '') + ' · ' + totalConductores + ' total';
    }

    function cargarDatos() {
        verificarCorteAutomatico();
        db.ref('conductores').on('value', snap => {
            const tbody = document.getElementById('lista-conductores');
            tbody.innerHTML = "";
            totalConductores = 0;
            
            if (!snap.exists()) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty">No hay conductores registrados</td></tr>';
                document.getElementById('contadorResultados').textContent = '0 conductores';
                return;
            }
            
            let index = 1;
            snap.forEach(child => {
                const d = child.val() || {};
                const cel = child.key;
                const email = d.email || d.correo || '—';
                const califs = d.calificaciones || {};
                let totalEstrellas = 0, conteo = 0;
                Object.values(califs).forEach(c => {
                    totalEstrellas += (parseFloat(c.estrellas) || 0);
                    conteo++;
                });
                const promedio = conteo > 0 ? (totalEstrellas / conteo).toFixed(1) : "0.0";
                const estado = d.estado || 'pendiente';
                const claseBadge = estado === 'pendiente' ? 'badge-pendiente' : (estado === 'activo' ? 'badge-activo' : 'badge-bloqueado');
                const tienePerfil = d.foto_conductor ? '✅' : '❌';
                const tieneCarro = d.foto_carro ? '✅' : '❌';

                let btnEstado = '';
                if (estado === 'pendiente') {
                    btnEstado = `<button class="btn btn-active" onclick="cambiarEstado('${cel}','activo')">✅ ACEPTAR</button>`;
                } else if (estado === 'activo') {
                    btnEstado = `<button class="btn btn-block" onclick="cambiarEstado('${cel}','bloqueado')">⛔ BLOQUEAR</button>`;
                } else {
                    btnEstado = `<button class="btn btn-active" onclick="cambiarEstado('${cel}','activo')">✅ ACTIVAR</button>`;
                }

                const searchText = ((d.nombre || '') + ' ' + cel + ' ' + email).toLowerCase();
                totalConductores++;

                tbody.innerHTML += `
                <tr class="driver-row" data-search="${searchText}" data-estado="${estado}">
                    <td style="color:var(--muted);font-size:12px;">${index}</td>
                    <td class="nombre-cell">${d.nombre || 'Sin nombre'}</td>
                    <td class="tel-cell">${cel}</td>
                    <td class="email-cell">${email}</td>
                    <td><span class="badge ${claseBadge}">${estado.toUpperCase()}</span></td>
                    <td class="deuda">B/. ${parseFloat(d.deuda || 0).toFixed(2)}</td>
                    <td>⭐ ${promedio} <small style="color:var(--muted)">(${conteo})</small></td>
                    <td class="fotos-ok">${tienePerfil} Perfil<br>${tieneCarro} Carro</td>
                    <td class="acciones-cell">
                        ${btnEstado}
                        <button class="btn btn-reset" onclick="pagarDeuda('${cel}')">💰 PAGÓ</button>
                        <button class="btn btn-info" onclick="abrirModal('${cel}')">💬</button>
                        <button class="btn btn-info" onclick="abrirModalFotos('${cel}')">📷</button>
                        <button class="btn btn-danger" onclick="eliminarConductor('${cel}')">🗑️</button>
                    </td>
                </tr>`;
                index++;
            });
            
            aplicarFiltros();
        });
    }

    function verificarCorteAutomatico() {
        const hoy = new Date().toISOString().split('T')[0];
        db.ref('sistema/ultimoCorte').once('value', snap => {
            const ultimoCorte = snap.val();
            if (ultimoCorte !== hoy) {
                document.getElementById('estadoSistema').innerHTML = '<span style="color:#dc3545;">⚠️ Aplicando corte automático...</span>';
                db.ref('conductores').once('value', conductoresSnap => {
                    let updates = {};
                    conductoresSnap.forEach(c => {
                        let deudaActual = parseFloat((c.val() || {}).deuda || 0);
                        updates[c.key + '/estado'] = 'bloqueado';
                        updates[c.key + '/deuda'] = deudaActual + 1.00;
                    });
                    db.ref('conductores').update(updates).then(() => {
                        db.ref('sistema').update({ ultimoCorte: hoy });
                        document.getElementById('estadoSistema').innerHTML = '<span style="color:#28a745;">✅ Corte diario aplicado. Unidades bloqueadas.</span>';
                    });
                });
            } else {
                document.getElementById('estadoSistema').innerHTML = '<span style="color:#28a745;">✅ Sistema al día</span>';
            }
        });
    }

    function abrirModal(cel) {
        const modal = document.getElementById('modalComentarios');
        modal.classList.add('open');
        modal.style.display = 'flex';
        const contenedor = document.getElementById('lista-detallada');
        contenedor.innerHTML = 'Cargando...';
        const celLimpio = String(cel).replace(/\D/g, '');
        function pintarLista(lista) {
            if (!lista.length) {
                contenedor.innerHTML = '<div class="empty">No hay comentarios aún para este conductor.<br><br>Aparecen cuando el pasajero califica al terminar el viaje.</div>';
                return;
            }
            lista.sort(function(a, b) {
                var fa = typeof a.fecha === 'number' ? a.fecha : (Date.parse(a.fecha) || 0);
                var fb = typeof b.fecha === 'number' ? b.fecha : (Date.parse(b.fecha) || 0);
                return fb - fa;
            });
            var html = '';
            lista.forEach(function(data) {
                var fechaLegible = '';
                if (data.fecha) {
                    var d = typeof data.fecha === 'number' ? new Date(data.fecha) : new Date(data.fecha);
                    fechaLegible = isNaN(d.getTime()) ? String(data.fecha) : d.toLocaleString();
                }
                html += '<div class="comentario">';
                html += '<span class="stars">' + (data.estrellas || 0) + ' ★</span>';
                html += '<span class="fecha"> ' + fechaLegible + '</span><br>';
                if (data.pasajero) html += '<span style="color:#2EC4E6;font-size:12px;">👤 ' + data.pasajero + '</span><br>';
                html += '<span>' + data.texto + '</span></div>';
            });
            html += '<button class="btn btn-danger" style="margin-top:12px;width:100%;" onclick="limpiarTextosComentarios(\'' + cel + '\')">🗑️ Borrar SOLO textos</button>';
            contenedor.innerHTML = html;
        }
        function mapSnap(snap) {
            var lista = [];
            if (!snap || !snap.exists()) return lista;
            snap.forEach(function(c) {
                var data = c.val() || {};
                lista.push({
                    id: c.key,
                    estrellas: data.estrellas || data.calificacion || 0,
                    texto: data.comentario || data.comentario_pasajero || data.texto || 'Sin comentario',
                    pasajero: data.pasajero || data.nombre_pasajero || '',
                    fecha: data.fecha || data.fecha_texto || 0
                });
            });
            return lista;
        }
        db.ref('conductores/' + cel + '/calificaciones').once('value').then(function(snap) {
            var lista = mapSnap(snap);
            if (lista.length) { pintarLista(lista); return; }
            if (celLimpio && celLimpio !== cel) {
                return db.ref('conductores/' + celLimpio + '/calificaciones').once('value').then(function(snap2) {
                    pintarLista(mapSnap(snap2));
                });
            }
            pintarLista([]);
        }).catch(function(err) {
            contenedor.innerHTML = '<div class="empty">Error al cargar: ' + (err.message || '') + '</div>';
        });
    }

    function cerrarModal() {
        const modal = document.getElementById('modalComentarios');
        modal.classList.remove('open');
        modal.style.display = 'none';
    }

    function abrirModalFotos(cel) {
        const modal = document.getElementById('modalFotos');
        modal.classList.add('open');
        modal.style.display = 'flex';
        const cont = document.getElementById('contenidoFotos');
        cont.innerHTML = `
            <div class="foto-controls">
                <label>Foto de perfil</label>
                <input type="file" id="file-${cel}-perfil" accept="image/*">
                <button class="btn btn-info" style="width:100%;margin-top:6px;" onclick="subirImagen('${cel}','perfil')">📷 Subir Perfil</button>
            </div>
            <div class="foto-controls">
                <label>Foto del carro</label>
                <input type="file" id="file-${cel}-carro" accept="image/*">
                <button class="btn btn-info" style="width:100%;margin-top:6px;" onclick="subirImagen('${cel}','carro')">🚗 Subir Carro</button>
            </div>
        `;
    }

    function cerrarModalFotos() {
        const modal = document.getElementById('modalFotos');
        modal.classList.remove('open');
        modal.style.display = 'none';
    }

    function limpiarTextosComentarios(cel) {
        if (!confirm('¿Borrar textos y mantener estrellas?')) return;
        db.ref('conductores/' + cel + '/calificaciones').once('value', snap => {
            snap.forEach(child => {
                child.ref.update({ comentario: null, comentario_pasajero: null });
            });
            alert('Textos eliminados.');
            cerrarModal();
        });
    }

    function subirImagen(cel, tipo) {
        const fileInput = document.getElementById('file-' + cel + '-' + tipo);
        const file = fileInput && fileInput.files[0];
        if (!file) return alert('Selecciona un archivo');
        const nombreCampoDB = tipo === 'perfil' ? 'foto_conductor' : 'foto_carro';
        const storageRef = storage.ref('conductores/' + cel + '/' + tipo + '.jpg');
        alert('Subiendo...');
        storageRef.put(file).then(snapshot => {
            snapshot.ref.getDownloadURL().then(url => {
                db.ref('conductores/' + cel).update({ [nombreCampoDB]: url });
                alert('¡Foto subida!');
                cerrarModalFotos();
            });
        }).catch(err => alert('Error: ' + err.message));
    }

    function cambiarEstado(cel, nuevoEstado) {
        db.ref('conductores/' + cel).update({ estado: nuevoEstado });
    }

    function pagarDeuda(cel) {
        db.ref('conductores/' + cel).update({ deuda: 0, estado: 'activo' });
    }

    function eliminarConductor(cel) {
        if (confirm('¿Eliminar conductor ' + cel + '?')) {
            db.ref('conductores/' + cel).remove();
        }
    }

    function corteDiario() {
        if (!confirm('¿Ejecutar corte diario y bloquear todas las unidades?')) return;
        const hoy = new Date().toISOString().split('T')[0];
        db.ref('conductores').once('value', snap => {
            let updates = {};
            snap.forEach(c => {
                let deudaActual = parseFloat((c.val() || {}).deuda || 0);
                updates[c.key + '/estado'] = 'bloqueado';
                updates[c.key + '/deuda'] = deudaActual + 1.00;
            });
            db.ref('conductores').update(updates).then(() => {
                db.ref('sistema').update({ ultimoCorte: hoy });
                alert('Corte diario ejecutado.');
            });
        });
    }

    function cierreSemanal() {
        if (!confirm('¿Reseteo semanal de viajes y deudas?')) return;
        db.ref('viajes').remove();
        db.ref('conductores').once('value', snap => {
            let updates = {};
            snap.forEach(c => {
                updates[c.key + '/deuda'] = 0;
                updates[c.key + '/estado'] = 'activo';
            });
            db.ref('conductores').update(updates).then(() => {
                alert('Reseteo semanal completado.');
            });
        });
    }

    // ---- LOGIN ADMIN ----
    function loginAdmin() {
        const user = (document.getElementById('adminUser').value || '').trim().toLowerCase();
        const pass = document.getElementById('adminPass').value || '';
        const err = document.getElementById('loginError');
        if (!user || !pass) {
            err.style.display = 'block';
            err.textContent = 'Completa usuario y contraseña';
            return;
        }
        db.ref('admins/' + user).once('value').then(snap => {
            const data = snap.val();
            if (!data) {
                err.style.display = 'block';
                err.textContent = 'Usuario o contraseña incorrectos';
                return;
            }
            let esValido = false;
            if (String(data.password) === String(pass)) {
                esValido = true;
            } else if (data.password && typeof data.password === 'object') {
                if (data.password[pass] !== undefined) {
                    esValido = true;
                }
            } else if (data[pass] !== undefined) {
                esValido = true;
            }
            if (esValido) {
                sessionStorage.setItem('admin_ok', '1');
                sessionStorage.setItem('admin_user', user);
                sessionStorage.setItem('admin_nombre', data.nombre || user);
                mostrarAdmin();
            } else {
                err.style.display = 'block';
                err.textContent = 'Usuario o contraseña incorrectos';
            }
        }).catch((error) => {
            console.error("Error de conexión:", error);
            err.style.display = 'block';
            err.textContent = 'Error de conexión con la base de datos';
        });
    }

    function logoutAdmin() {
        sessionStorage.removeItem('admin_ok');
        sessionStorage.removeItem('admin_user');
        sessionStorage.removeItem('admin_nombre');
        location.reload();
    }

    function mostrarAdmin() {
        document.getElementById('pantallaLogin').classList.add('oculto');
        document.getElementById('appAdmin').classList.add('visible');
        const nom = sessionStorage.getItem('admin_nombre') || 'Admin';
        const el = document.getElementById('adminNombreTop');
        if (el) el.textContent = 'Hola, ' + nom;
        cargarDatos();
    }

    function checkSesion() {
        if (sessionStorage.getItem('admin_ok') === '1') {
            mostrarAdmin();
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && document.getElementById('pantallaLogin') &&
            !document.getElementById('pantallaLogin').classList.contains('oculto')) {
            loginAdmin();
        }
    });

    window.onload = checkSesion;
</script>
</div></body>
</html>
