<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2EC4E6">
    <title>Admin Click & Go Taxi</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <style>
        :root {
            --cyan: #2EC4E6;
            --cyan-dark: #1A9CB8;
            --yellow: #FFC107;
            --green: #28a745;
            --red: #dc3545;
            --purple: #6f42c1;
            --dark: #0b0b0b;
            --card: #121a1f;
            --border: #2a3a45;
            --text: #ffffff;
            --muted: #9aadb8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 40px;
        }
        .top {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            text-align: center;
        }
        .top h1 {
            font-size: 20px;
            color: var(--cyan);
            margin-bottom: 6px;
        }
        #estadoSistema {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 10px;
            text-align: center;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-corte { background: var(--purple); color: #fff; }
        .btn-reporte { background: var(--cyan); color: #0b0b0b; }
        .btn-semana { background: #333; color: #fff; border: 1px solid var(--border); }
        .btn-active { background: var(--green); color: #fff; }
        .btn-block { background: var(--red); color: #fff; }
        .btn-reset { background: #0d6efd; color: #fff; }
        .btn-danger { background: #a71d2a; color: #fff; }
        .btn-info { background: var(--cyan-dark); color: #fff; font-size: 13px; padding: 12px; }
        .btn-sm {
            display: inline-block;
            width: auto;
            min-width: 48%;
            padding: 12px 10px;
            font-size: 13px;
            margin: 4px 1%;
        }
        .buscador {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid var(--cyan);
            background: #152028;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-top: 6px;
        }
        .lista { display: flex; flex-direction: column; gap: 12px; }
        .driver-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
        }
        .driver-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }
        .driver-name { font-size: 17px; font-weight: 800; color: #fff; }
        .driver-cel { font-size: 13px; color: var(--cyan); margin-top: 2px; }
        .badge {
            font-size: 11px;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .badge-activo { background: rgba(40,167,69,0.2); color: #28a745; }
        .badge-bloqueado { background: rgba(220,53,69,0.2); color: #dc3545; }
        .badge-pendiente { background: rgba(255,193,7,0.2); color: #ffc107; }
        .meta {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .meta strong { color: var(--yellow); }
        .fotos-ok { font-size: 12px; margin-bottom: 10px; }
        .foto-controls {
            background: #0d1418;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px dashed var(--border);
        }
        .foto-controls label {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .foto-controls input[type="file"] {
            width: 100%;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 8px;
        }
        .acciones {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -4px;
        }
        .acciones .btn { margin-bottom: 8px; }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.75);
            align-items: flex-end;
            justify-content: center;
        }
        .modal.open { display: flex; }
        .modal-sheet {
            background: #152028;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            overflow-y: auto;
            border-top: 3px solid var(--cyan);
        }
        .modal-sheet h3 { color: var(--cyan); margin-bottom: 12px; font-size: 18px; }
        .close-btn {
            float: right;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            padding: 0 6px;
        }
        .comentario {
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            font-size: 14px;
        }
        .comentario .stars { color: var(--yellow); font-weight: 800; }
        .comentario .fecha { font-size: 11px; color: var(--muted); }
        .empty {
            text-align: center;
            color: var(--muted);
            padding: 30px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="top">
        <h1>🚕 Admin Click & Go</h1>
        <div id="estadoSistema">Verificando ciclo diario...</div>

        <button class="btn btn-corte" onclick="corteDiario()">🌙 CORTE DIARIO MANUAL</button>
        <button class="btn btn-reporte" onclick="window.open('admin_reporte_diario.html', '_blank')">📊 REPORTE DIARIO</button>
        <button class="btn btn-semana" onclick="cierreSemanal()">🔄 RESETEO SEMANAL</button>

        <input type="text" id="buscador" class="buscador" onkeyup="filtrarConductores()" placeholder="🔍 Buscar conductor o celular...">
    </div>

    <div class="lista" id="lista-conductores"></div>

    <div id="modalComentarios" class="modal" onclick="if(event.target===this)cerrarModal()">
        <div class="modal-sheet">
            <button class="close-btn" onclick="cerrarModal()">&times;</button>
            <h3>Comentarios</h3>
            <div id="lista-detallada"></div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD1c5lxn2ehGS_Wo5Htbkwi0gUcdpauiMg",
        databaseURL: "https://preetytaxiapp-default-rtdb.firebaseio.com/",
        storageBucket: "preetytaxiapp.firebasestorage.app"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    function cargarDatos() {
        verificarCorteAutomatico();
        db.ref('conductores').on('value', snap => {
            const lista = document.getElementById('lista-conductores');
            lista.innerHTML = "";
            if (!snap.exists()) {
                lista.innerHTML = '<div class="empty">No hay conductores registrados</div>';
                return;
            }
            snap.forEach(child => {
                const d = child.val() || {};
                const cel = child.key;
                const califs = d.calificaciones || {};
                let totalEstrellas = 0, conteo = 0;
                Object.values(califs).forEach(c => {
                    totalEstrellas += (parseFloat(c.estrellas) || 0);
                    conteo++;
                });
                const promedio = conteo > 0 ? (totalEstrellas / conteo).toFixed(1) : "0.0";
                const estado = d.estado || 'pendiente';
                const claseBadge = estado === 'pendiente' ? 'badge-pendiente' : (estado === 'activo' ? 'badge-activo' : 'badge-bloqueado');
                const tienePerfil = d.foto_conductor ? '✅ Perfil' : '❌ Perfil';
                const tieneCarro = d.foto_carro ? '✅ Carro' : '❌ Carro';

                let btnEstado = '';
                if (estado === 'pendiente') {
                    btnEstado = `<button class="btn btn-active btn-sm" onclick="cambiarEstado('${cel}','activo')">✅ ACEPTAR</button>`;
                } else if (estado === 'activo') {
                    btnEstado = `<button class="btn btn-block btn-sm" onclick="cambiarEstado('${cel}','bloqueado')">⛔ BLOQUEAR</button>`;
                } else {
                    btnEstado = `<button class="btn btn-active btn-sm" onclick="cambiarEstado('${cel}','activo')">✅ ACTIVAR</button>`;
                }

                lista.innerHTML += `
                <div class="driver-card" data-search="${(d.nombre||'')+' '+cel}">
                    <div class="driver-head">
                        <div>
                            <div class="driver-name">${d.nombre || 'Sin nombre'}</div>
                            <div class="driver-cel">${cel}</div>
                        </div>
                        <span class="badge ${claseBadge}">${estado.toUpperCase()}</span>
                    </div>
                    <div class="meta">
                        Deuda: <strong>B/. ${parseFloat(d.deuda || 0).toFixed(2)}</strong><br>
                        ⭐ ${promedio} · ${conteo} viajes
                    </div>
                    <div class="fotos-ok">${tienePerfil} &nbsp; ${tieneCarro}</div>
                    <div class="foto-controls">
                        <label>Foto perfil</label>
                        <input type="file" id="file-${cel}-perfil" accept="image/*">
                        <button class="btn btn-info" onclick="subirImagen('${cel}','perfil')">📷 Subir Perfil</button>
                        <label style="margin-top:10px;">Foto carro</label>
                        <input type="file" id="file-${cel}-carro" accept="image/*">
                        <button class="btn btn-info" onclick="subirImagen('${cel}','carro')">🚗 Subir Carro</button>
                    </div>
                    <div class="acciones">
                        ${btnEstado}
                        <button class="btn btn-reset btn-sm" onclick="pagarDeuda('${cel}')">💰 PAGÓ</button>
                        <button class="btn btn-info btn-sm" onclick="abrirModal('${cel}')">💬 Comentarios</button>
                        <button class="btn btn-danger btn-sm" onclick="eliminarConductor('${cel}')">🗑️ Eliminar</button>
                    </div>
                </div>`;
            });
        });
    }

    function verificarCorteAutomatico() {
        const hoy = new Date().toISOString().split('T')[0];
        db.ref('sistema/ultimoCorte').once('value', snap => {
            const ultimoCorte = snap.val();
            if (ultimoCorte !== hoy) {
                document.getElementById('estadoSistema').innerHTML = '<span style="color:#dc3545;">⚠️ Aplicando corte automático...</span>';
                db.ref('conductores').once('value', conductoresSnap => {
                    let updates = {};
                    conductoresSnap.forEach(c => {
                        let deudaActual = parseFloat((c.val() || {}).deuda || 0);
                        updates[c.key + '/estado'] = 'bloqueado';
                        updates[c.key + '/deuda'] = deudaActual + 1.00;
                    });
                    db.ref('conductores').update(updates).then(() => {
                        db.ref('sistema').update({ ultimoCorte: hoy });
                        document.getElementById('estadoSistema').innerHTML = '<span style="color:#28a745;">✅ Corte diario aplicado. Unidades bloqueadas.</span>';
                    });
                });
            } else {
                document.getElementById('estadoSistema').innerHTML = '<span style="color:#28a745;">✅ Sistema al día</span>';
            }
        });
    }

    function abrirModal(cel) {
        const modal = document.getElementById('modalComentarios');
        modal.classList.add('open');
        modal.style.display = 'flex';
        const contenedor = document.getElementById('lista-detallada');
        contenedor.innerHTML = 'Cargando...';
        db.ref('conductores/' + cel + '/calificaciones').once('value', snap => {
            if (!snap.exists()) {
                contenedor.innerHTML = '<div class="empty">No hay comentarios</div>';
                return;
            }
            let lista = [];
            snap.forEach(c => lista.push(c.val()));
            lista.sort((a, b) => (b.fecha || 0) - (a.fecha || 0));
            let html = '';
            lista.forEach(data => {
                const texto = data.comentario || data.comentario_pasajero || 'Sin comentario';
                const fechaLegible = data.fecha ? new Date(data.fecha).toLocaleDateString() : '';
                html += `<div class="comentario">
                    <span class="stars">${data.estrellas} ★</span>
                    <span class="fecha"> ${fechaLegible}</span><br>
                    ${texto}
                </div>`;
            });
            html += `<button class="btn btn-danger" style="margin-top:12px;" onclick="limpiarTextosComentarios('${cel}')">🗑️ Borrar SOLO textos</button>`;
            contenedor.innerHTML = html;
        });
    }

    function cerrarModal() {
        const modal = document.getElementById('modalComentarios');
        modal.classList.remove('open');
        modal.style.display = 'none';
    }

    function limpiarTextosComentarios(cel) {
        if (!confirm('¿Borrar textos y mantener estrellas?')) return;
        db.ref('conductores/' + cel + '/calificaciones').once('value', snap => {
            snap.forEach(child => {
                child.ref.update({ comentario: null, comentario_pasajero: null });
            });
            alert('Textos eliminados.');
            cerrarModal();
        });
    }

    function subirImagen(cel, tipo) {
        const fileInput = document.getElementById('file-' + cel + '-' + tipo);
        const file = fileInput && fileInput.files[0];
        if (!file) return alert('Selecciona un archivo');
        const nombreCampoDB = tipo === 'perfil' ? 'foto_conductor' : 'foto_carro';
        const storageRef = storage.ref('conductores/' + cel + '/' + tipo + '.jpg');
        alert('Subiendo...');
        storageRef.put(file).then(snapshot => {
            snapshot.ref.getDownloadURL().then(url => {
                db.ref('conductores/' + cel).update({ [nombreCampoDB]: url });
                alert('¡Foto subida!');
            });
        }).catch(err => alert('Error: ' + err.message));
    }

    function cambiarEstado(cel, nuevoEstado) {
        db.ref('conductores/' + cel).update({ estado: nuevoEstado });
    }

    function pagarDeuda(cel) {
        db.ref('conductores/' + cel).update({ deuda: 0, estado: 'activo' });
    }

    function eliminarConductor(cel) {
        if (confirm('¿Eliminar conductor ' + cel + '?')) {
            db.ref('conductores/' + cel).remove();
        }
    }

    function corteDiario() {
        if (!confirm('¿Ejecutar corte diario y bloquear todas las unidades?')) return;
        const hoy = new Date().toISOString().split('T')[0];
        db.ref('conductores').once('value', snap => {
            let updates = {};
            snap.forEach(c => {
                let deudaActual = parseFloat((c.val() || {}).deuda || 0);
                updates[c.key + '/estado'] = 'bloqueado';
                updates[c.key + '/deuda'] = deudaActual + 1.00;
            });
            db.ref('conductores').update(updates).then(() => {
                db.ref('sistema').update({ ultimoCorte: hoy });
                alert('Corte diario ejecutado.');
            });
        });
    }

    function cierreSemanal() {
        if (!confirm('¿Reseteo semanal de viajes y deudas?')) return;
        db.ref('viajes').remove();
        db.ref('conductores').once('value', snap => {
            let updates = {};
            snap.forEach(c => {
                updates[c.key + '/deuda'] = 0;
                updates[c.key + '/estado'] = 'activo';
            });
            db.ref('conductores').update(updates).then(() => {
                alert('Reseteo semanal completado.');
            });
        });
    }

    function filtrarConductores() {
        const q = (document.getElementById('buscador').value || '').toLowerCase();
        document.querySelectorAll('.driver-card').forEach(card => {
            const txt = (card.getAttribute('data-search') || card.textContent || '').toLowerCase();
            card.style.display = txt.includes(q) ? '' : 'none';
        });
    }

    window.onload = cargarDatos;
</script>
</body>
</html>
