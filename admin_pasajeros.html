<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2EC4E6">
    <title>Admin Pasajeros - Click & Go Taxi</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --cyan: #2EC4E6; --cyan-dark: #1A9CB8; --yellow: #FFC107; --green: #28a745; --red: #dc3545; --dark: #0b0b0b; --card: #121a1f; --border: #2a3a45; --muted: #9aadb8; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: var(--dark); color: #fff; min-height: 100vh; padding: 12px; padding-bottom: 40px; }
        .top { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; text-align: center; }
        .top h1 { font-size: 20px; color: var(--cyan); margin-bottom: 6px; }
        .btn { display: inline-block; padding: 10px 12px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; margin: 3px 2px; }
        .btn-active { background: var(--green); color: #fff; }
        .btn-block { background: var(--red); color: #fff; }
        .btn-danger { background: #a71d2a; color: #fff; }
        .btn-wa { background: #25D366; color: #fff; }
        .btn-link { background: transparent; border: 1px solid var(--border); color: var(--muted); width: 100%; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; margin-top: 8px; cursor: pointer; }
        .buscador { width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--cyan); background: #152028; color: #fff; font-size: 16px; outline: none; margin: 6px 0 12px; }
        .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; justify-content: center; }
        .filtro-btn { padding: 10px 16px; border-radius: 20px; border: 2px solid transparent; font-size: 13px; font-weight: 700; cursor: pointer; opacity: 0.75; }
        .filtro-btn[data-filtro="todos"] { background: #fff; color: #0b0b0b; }
        .filtro-btn[data-filtro="pendiente"] { background: #FFC107; color: #0b0b0b; }
        .filtro-btn[data-filtro="activo"] { background: #28a745; color: #fff; }
        .filtro-btn[data-filtro="bloqueado"] { background: #dc3545; color: #fff; }
        .filtro-btn.activo { opacity: 1; box-shadow: 0 0 0 3px rgba(255,255,255,0.3); }
        #contador { font-size: 13px; color: var(--muted); margin-bottom: 10px; text-align: center; }
        .lista { display: flex; flex-direction: column; gap: 12px; }
        .card-p { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: left; }
        .card-p.pendiente { border-color: rgba(255,193,7,0.5); }
        .card-p .nombre { font-weight: 800; font-size: 16px; margin-bottom: 4px; }
        .card-p .meta { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
        .badge { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-top: 6px; }
        .badge-activo { background: rgba(40,167,69,0.2); color: #28a745; }
        .badge-bloqueado { background: rgba(220,53,69,0.2); color: #dc3545; }
        .badge-pendiente { background: rgba(255,193,7,0.2); color: #ffc107; }
        .fotos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
        .fotos-grid a { display: block; text-decoration: none; }
        .fotos-grid img { width: 100%; height: 90px; object-fit: cover; border-radius: 10px; border: 2px solid #2a3a45; background: #111; }
        .fotos-grid span { display: block; font-size: 10px; color: var(--muted); text-align: center; margin-top: 4px; }
        .acciones { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
        .aviso-seguridad { background: rgba(37,211,102,0.12); border: 1px solid rgba(37,211,102,0.4); color: #25D366; padding: 12px; border-radius: 10px; font-size: 12px; margin-bottom: 12px; text-align: left; line-height: 1.4; }
        #pantallaLogin { position: fixed; inset: 0; z-index: 10000; background: #0b0b0b; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #pantallaLogin.oculto { display: none; }
        .login-box { width: 100%; max-width: 360px; background: #121a1f; border: 1px solid #2a3a45; border-radius: 18px; padding: 24px 20px; text-align: center; }
        .login-box h2 { color: #2EC4E6; margin-bottom: 6px; }
        .login-box p { color: #9aadb8; font-size: 13px; margin-bottom: 18px; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #2a3a45; background: #152028; color: #fff; font-size: 16px; }
        .login-box .btn-login { width: 100%; padding: 16px; border: none; border-radius: 12px; background: #FFC107; color: #0b0b0b; font-weight: 800; font-size: 16px; cursor: pointer; }
        #appAdmin { display: none; }
        #appAdmin.visible { display: block; }
        .modal-foto { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 99999; align-items: center; justify-content: center; padding: 16px; }
        .modal-foto.open { display: flex; }
        .modal-foto img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
    </style>
</head>
<body>

<div id="pantallaLogin">
    <div class="login-box">
        <h2>👤 Admin Pasajeros</h2>
        <p>Aprobación con verificación de cédula</p>
        <input type="text" id="adminUser" placeholder="Usuario" autocomplete="username">
        <input type="password" id="adminPass" placeholder="Contraseña" autocomplete="current-password">
        <button class="btn-login" onclick="loginAdmin()">ENTRAR</button>
        <p id="loginError" style="color:#dc3545; margin-top:12px; font-size:13px; display:none;"></p>
    </div>
</div>

<div id="appAdmin">
    <div class="top">
        <h1>👤 Admin Pasajeros</h1>
        <div id="adminNombreTop" style="font-size:13px;color:#9aadb8;margin-bottom:8px;"></div>
        <div class="aviso-seguridad">
            💬 Al <b>APROBAR</b> se abre WhatsApp con el mensaje listo. Solo tocas <b>Enviar</b>.
        </div>
        <input type="text" id="buscador" class="buscador" onkeyup="aplicarFiltros()" placeholder="🔍 Buscar por teléfono, correo o nombre...">
        <div class="filtros">
            <button class="filtro-btn activo" data-filtro="todos" onclick="setFiltro('todos')">Todos</button>
            <button class="filtro-btn" data-filtro="pendiente" onclick="setFiltro('pendiente')">Pendientes</button>
            <button class="filtro-btn" data-filtro="activo" onclick="setFiltro('activo')">Activos</button>
            <button class="filtro-btn" data-filtro="bloqueado" onclick="setFiltro('bloqueado')">Bloqueados</button>
        </div>
        <div id="contador">Cargando...</div>
        <button type="button" class="btn-link" onclick="window.open('admin_panel.html','_blank')">🚕 Ir a Admin Conductores</button>
        <button type="button" class="btn-link" onclick="logoutAdmin()">🚪 Cerrar sesión</button>
    </div>
    <div class="lista" id="lista-pasajeros"></div>
</div>

<div class="modal-foto" id="modalFoto" onclick="this.classList.remove('open')">
    <img id="modalFotoImg" src="" alt="Foto ampliada">
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD1c5lxn2ehGS_Wo5Htbkwi0gUcdpauiMg",
        databaseURL: "https://preetytaxiapp-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let filtroActual = 'todos';
    let totalPasajeros = 0;

    /** Normaliza a formato internacional Panamá (507...) para wa.me */
    function telWhatsApp(cel) {
        let n = String(cel || '').replace(/\D/g, '');
        if (!n) return '';
        // Si ya empieza con 507 y tiene 11 dígitos, ok
        if (n.startsWith('507') && n.length >= 11) return n;
        // Si es 8 dígitos locales Panamá
        if (n.length === 8) return '507' + n;
        // Si es 10-11 y no tiene 507, intentar
        if (n.length >= 8 && !n.startsWith('507')) return '507' + n.slice(-8);
        return n;
    }

    function mensajeAprobado(nombre) {
        const nom = (nombre || 'pasajero').trim();
        return 'Hola ' + nom + ', tu cuenta en *Click & Go Taxi* fue *APROBADA*. ✅\n\nYa puedes iniciar sesión y pedir taxis.\n\n¡Bienvenido!';
    }

    function mensajeRechazado(nombre) {
        const nom = (nombre || 'pasajero').trim();
        return 'Hola ' + nom + ', tu registro en Click & Go Taxi no pudo ser aprobado. Por favor vuelve a registrarte con fotos claras de tu cara, cédula y selfie con la cédula.';
    }

    /** Abre WhatsApp con texto listo; tú solo tocas Enviar */
    function abrirWhatsApp(cel, texto) {
        const tel = telWhatsApp(cel);
        if (!tel) {
            alert('No hay número de teléfono para WhatsApp.');
            return;
        }
        const url = 'https://wa.me/' + tel + '?text=' + encodeURIComponent(texto);
        window.open(url, '_blank');
    }

    function setFiltro(filtro) {
        filtroActual = filtro;
        document.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.classList.toggle('activo', btn.getAttribute('data-filtro') === filtro);
        });
        aplicarFiltros();
    }

    function aplicarFiltros() {
        const q = (document.getElementById('buscador').value || '').toLowerCase().trim();
        let visibles = 0;
        document.querySelectorAll('.pasajero-card').forEach(card => {
            const texto = (card.getAttribute('data-search') || '').toLowerCase();
            const estado = (card.getAttribute('data-estado') || '').toLowerCase();
            const ok = (!q || texto.includes(q)) && (filtroActual === 'todos' || estado === filtroActual);
            card.style.display = ok ? '' : 'none';
            if (ok) visibles++;
        });
        document.getElementById('contador').textContent =
            visibles + ' pasajeros' + (filtroActual !== 'todos' ? ' · ' + filtroActual : '') + ' · ' + totalPasajeros + ' total';
    }

    function verFoto(url) {
        if (!url) return;
        document.getElementById('modalFotoImg').src = url;
        document.getElementById('modalFoto').classList.add('open');
    }

    function imgOrEmpty(url, label) {
        if (!url) return `<div><div style="height:90px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:20px;">❌</div><span>${label}</span></div>`;
        const safe = String(url).replace(/'/g, "\\'");
        return `<a href="javascript:void(0)" onclick="verFoto('${safe}')"><img src="${url}" alt="${label}" onerror="this.style.opacity=0.3"><span>${label}</span></a>`;
    }

    function cargarPasajeros() {
        db.ref('pasajeros').on('value', snap => {
            const cont = document.getElementById('lista-pasajeros');
            cont.innerHTML = '';
            totalPasajeros = 0;
            if (!snap.exists()) {
                cont.innerHTML = '<div class="empty">No hay pasajeros registrados</div>';
                document.getElementById('contador').textContent = '0 pasajeros';
                return;
            }
            snap.forEach(child => {
                const p = child.val() || {};
                const cel = child.key;
                const estado = (p.estado || 'activo').toLowerCase();
                const claseBadge = estado === 'pendiente' ? 'badge-pendiente' : (estado === 'activo' ? 'badge-activo' : 'badge-bloqueado');
                let btns = '';
                if (estado === 'pendiente') {
                    btns = `<button class="btn btn-active" onclick="cambiarEstado('${cel}','activo')">✅ APROBAR + WhatsApp</button>
                            <button class="btn btn-block" onclick="cambiarEstado('${cel}','bloqueado')">⛔ RECHAZAR + WhatsApp</button>`;
                } else if (estado === 'activo') {
                    btns = `<button class="btn btn-block" onclick="cambiarEstado('${cel}','bloqueado')">⛔ BLOQUEAR</button>
                            <button class="btn btn-wa" onclick="soloWhatsAppAprobado('${cel}')">💬 WhatsApp</button>`;
                } else {
                    btns = `<button class="btn btn-active" onclick="cambiarEstado('${cel}','activo')">✅ ACTIVAR + WhatsApp</button>
                            <button class="btn btn-wa" onclick="soloWhatsAppAprobado('${cel}')">💬 WhatsApp</button>`;
                }
                const fecha = p.fecha_registro ? String(p.fecha_registro).substring(0, 10) : '—';
                const searchText = ((p.nombre || '') + ' ' + cel + ' ' + (p.email || '')).toLowerCase();
                totalPasajeros++;
                cont.innerHTML += `
                <div class="card-p pasajero-card ${estado === 'pendiente' ? 'pendiente' : ''}" data-search="${searchText}" data-estado="${estado}">
                    <div class="nombre">${p.nombre || 'Sin nombre'}</div>
                    <div class="meta">📱 ${cel}</div>
                    <div class="meta">✉️ ${p.email || '—'}</div>
                    <div class="meta">📅 ${fecha}</div>
                    <span class="badge ${claseBadge}">${estado.toUpperCase()}</span>
                    <div class="fotos-grid">
                        ${imgOrEmpty(p.foto_pasajero, 'Cara')}
                        ${imgOrEmpty(p.foto_cedula, 'Cédula')}
                        ${imgOrEmpty(p.foto_selfie_cedula, 'Selfie+Céd')}
                    </div>
                    <div class="acciones">
                        ${btns}
                        <button class="btn btn-danger" onclick="eliminarPasajero('${cel}')">🗑️</button>
                    </div>
                </div>`;
            });
            aplicarFiltros();
        });
    }

    function cambiarEstado(cel, nuevoEstado) {
        db.ref('pasajeros/' + cel).once('value').then(snap => {
            const p = snap.val() || {};
            const nombre = p.nombre || '';
            return db.ref('pasajeros/' + cel).update({ estado: nuevoEstado }).then(() => {
                if (nuevoEstado === 'activo') {
                    abrirWhatsApp(cel, mensajeAprobado(nombre));
                    // aviso breve; WhatsApp ya se abrió
                    setTimeout(() => {
                        alert('✅ Cuenta aprobada.\n\nSe abrió WhatsApp con el mensaje listo.\nSolo toca Enviar.');
                    }, 400);
                } else if (nuevoEstado === 'bloqueado') {
                    if (confirm('¿Abrir WhatsApp para avisarle del rechazo?')) {
                        abrirWhatsApp(cel, mensajeRechazado(nombre));
                    }
                    alert('⛔ Pasajero rechazado / bloqueado.');
                }
            });
        });
    }

    function soloWhatsAppAprobado(cel) {
        db.ref('pasajeros/' + cel).once('value').then(snap => {
            const p = snap.val() || {};
            abrirWhatsApp(cel, mensajeAprobado(p.nombre));
        });
    }

    function eliminarPasajero(cel) {
        if (confirm('¿Eliminar pasajero ' + cel + '?')) db.ref('pasajeros/' + cel).remove();
    }

    function loginAdmin() {
        const user = (document.getElementById('adminUser').value || '').trim().toLowerCase();
        const pass = document.getElementById('adminPass').value || '';
        const err = document.getElementById('loginError');
        if (!user || !pass) { err.style.display = 'block'; err.textContent = 'Completa usuario y contraseña'; return; }
        db.ref('admins/' + user).once('value').then(snap => {
            const data = snap.val();
            if (!data) { err.style.display = 'block'; err.textContent = 'Usuario o contraseña incorrectos'; return; }
            let ok = false;
            if (String(data.password) === String(pass)) ok = true;
            else if (data.password && typeof data.password === 'object' && data.password[pass] !== undefined) ok = true;
            else if (data[pass] !== undefined) ok = true;
            if (ok) {
                sessionStorage.setItem('admin_ok', '1');
                sessionStorage.setItem('admin_user', user);
                sessionStorage.setItem('admin_nombre', data.nombre || user);
                mostrarAdmin();
            } else {
                err.style.display = 'block';
                err.textContent = 'Usuario o contraseña incorrectos';
            }
        }).catch(() => { err.style.display = 'block'; err.textContent = 'Error de conexión'; });
    }

    function logoutAdmin() {
        sessionStorage.removeItem('admin_ok');
        sessionStorage.removeItem('admin_user');
        sessionStorage.removeItem('admin_nombre');
        location.reload();
    }

    function mostrarAdmin() {
        document.getElementById('pantallaLogin').classList.add('oculto');
        document.getElementById('appAdmin').classList.add('visible');
        document.getElementById('adminNombreTop').textContent = 'Hola, ' + (sessionStorage.getItem('admin_nombre') || 'Admin');
        cargarPasajeros();
    }

    window.onload = function() {
        if (sessionStorage.getItem('admin_ok') === '1') mostrarAdmin();
    };
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !document.getElementById('pantallaLogin').classList.contains('oculto')) loginAdmin();
    });
</script>
</body>
</html>
