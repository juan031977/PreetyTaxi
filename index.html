<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClickGoTaxi</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2EC4E6">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Firebase SDK (Versión 8.10.1) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

    <style>
        :root {
            --cyan: #2EC4E6;
            --cyan-dark: #1A9CB8;
            --yellow: #FFC107;
            --white: #ffffff;
            --dark: #0b0b0b;
            --card: #121a1f;
            --gray-text: #a8b8c0;
            --gold: var(--yellow);
        }
        body { font-family: 'Arial', sans-serif; background: var(--dark); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; touch-action: manipulation; }
        .container { width: 90%; max-width: 400px; padding: 20px 0; }
        
        /* TÍTULO RESPONSIVO */
        h1 { 
            color: var(--cyan); 
            font-size: clamp(26px, 7.5vw, 36px); 
            margin: 0 0 5px 0; 
            font-weight: 800; 
            letter-spacing: -1px; 
            text-shadow: 0px 4px 15px rgba(46, 196, 230, 0.35); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            white-space: nowrap; 
        }

        .tagline { color: var(--gray-text); font-size: 14px; margin-top: 0; margin-bottom: 35px; }
        .role-selector { background: #152028; border: 1px solid #2a3a45; padding: 5px; border-radius: 30px; display: flex; margin-bottom: 30px; position: relative; }
        .role-btn { flex: 1; padding: 12px 0; border: none; background: transparent; color: var(--gray-text); font-weight: bold; font-size: 15px; cursor: pointer; border-radius: 25px; transition: all 0.3s ease; z-index: 2; }
        .role-btn.active { color: #0b0b0b; background: var(--cyan); box-shadow: 0 4px 12px rgba(46, 196, 230, 0.35); }
        .card { background: var(--card); padding: 30px 25px; border-radius: 24px; border: 1px solid #243440; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: none; animation: fadeIn 0.4s ease; }
        .card.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h3 { margin-top: 0; margin-bottom: 20px; color: #fff; font-size: 20px; letter-spacing: 0.5px; }
        .btn { display: block; padding: 16px; margin-top: 12px; border-radius: 14px; text-decoration: none; font-weight: bold; font-size: 16px; transition: all 0.2s ease; box-sizing: border-box; }
        .btn-gold { background: var(--yellow); color: #0b0b0b; box-shadow: 0 4px 12px rgba(255, 193, 7, 0.25); }
        .btn-outline { border: 2px solid var(--cyan); color: var(--cyan); }
        .btn:active { transform: scale(0.96); }
        .footer-text { font-size: 11px; color: #333; margin-top: 40px; letter-spacing: 1px; }

        /* ESTILO PARA TU IMAGEN PNG DESDE GITHUB */
        .taxi-png-icon {
            width: 36px;
            height: 48px;
            object-fit: contain;
            margin-left: 10px;
            vertical-align: middle;
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
            filter: drop-shadow(0px 4px 10px rgba(46, 196, 230, 0.55));
            animation: flotarPng 2.5s infinite alternate ease-in-out;
        }
        
        @keyframes flotarPng { 
            0% { transform: translateY(0px); } 
            100% { transform: translateY(-4px); } 
        }

        /* INTRO CINEMÁTICA — profesional y nítido */
        #intro-cine { position: fixed; inset: 0; background: #0b0b0b; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .escena-1 {
            position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
            animation: desvanecerEscena1 0.45s ease 2s forwards;
        }
        .intro-logo-wrap {
            width: 120px; height: 120px; border-radius: 28px;
            background: linear-gradient(145deg, #152028 0%, #0b0b0b 100%);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 28px rgba(46, 196, 230, 0.35), inset 0 0 20px rgba(46, 196, 230, 0.08);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 18px;
            animation: introPulse 1.6s ease-in-out infinite alternate;
        }
        .intro-logo-wrap img {
            width: 72px; height: 72px; object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(46, 196, 230, 0.4));
        }
        .titulo-cgt {
            color: #ffffff;
            font-size: clamp(18px, 5.5vw, 24px);
            font-weight: 800;
            letter-spacing: 3px;
            margin: 0;
            font-family: Arial, Helvetica, 'Segoe UI', sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
        }
        .titulo-cgt span { color: var(--cyan); }
        .escena-2 {
            position: absolute; inset: 0;
            background: linear-gradient(160deg, #2EC4E6 0%, #1A9CB8 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0;
            animation: mostrarEscena2 0.45s ease 2s forwards;
        }
        /* Giro 15° fijo — fuente limpia para que en celular no se vea corrida */
        .titulo-linea-1, .titulo-linea-2 {
            font-size: clamp(28px, 9vw, 42px);
            font-weight: 900;
            font-family: Arial, Helvetica, 'Segoe UI', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 4px 0;
            line-height: 1.15;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.28);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: rotate(-15deg);
            transform-origin: center center;
            animation: destelloScript 1.4s infinite alternate ease-in-out;
        }
        @keyframes introPulse {
            0% { box-shadow: 0 0 18px rgba(46, 196, 230, 0.25); }
            100% { box-shadow: 0 0 36px rgba(46, 196, 230, 0.55); }
        }
        @keyframes destelloScript {
            0%, 100% { color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.28); }
            50% { color: #FFC107; text-shadow: 0 2px 8px rgba(0,0,0,0.35); }
        }
        @keyframes desvanecerEscena1 { to { opacity: 0; visibility: hidden; } }
        @keyframes mostrarEscena2 { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="intro-cine">
    <div class="escena-1">
        <div class="intro-logo-wrap">
            <img src="https://raw.githubusercontent.com/juan031977/PreetyTaxi/main/taxi-logo.png" alt="Click & Go Taxi">
        </div>
        <div class="titulo-cgt">CLICK <span>&amp;</span> GO TAXI</div>
    </div>
    <div class="escena-2">
        <div class="titulo-linea-1">TU TAXI</div>
        <div class="titulo-linea-2">A UN CLICK</div>
    </div>
</div>

<div class="container">
    <!-- TÍTULO CON TU PNG DESDE GITHUB -->
    <h1>Click & Go 
        <img src="https://raw.githubusercontent.com/juan031977/PreetyTaxi/main/taxi-logo.png" alt="Taxi Logo" class="taxi-png-icon">
    </h1>
    
    <p class="tagline">¡Tu transporte en Panamá!</p>
    
    <div class="role-selector">
        <button type="button" id="btn-pasajero" class="role-btn active" onclick="window.switchRole('pasajero')">PASAJERO</button>
        <button type="button" id="btn-conductor" class="role-btn" onclick="window.switchRole('conductor')">CONDUCTOR</button>
    </div>

    <div id="card-pasajero" class="card active">
        <h3>¿A dónde vamos hoy? 👋</h3>
        <a href="login_pasajero.html" class="btn btn-gold">INGRESAR A PEDIR</a>
        <a href="registro_pasajero.html" class="btn btn-outline">CREAR CUENTA NUEVA</a>
    </div>
    <div id="card-conductor" class="card">
        <h3>Genera ingresos en tu ruta 💰</h3>
        <a href="login_conductor.html" class="btn btn-gold">EMPEZAR A TRABAJAR</a>
        <a href="registro_conductor.html" class="btn btn-outline">POSTULARSE AQUÍ</a>
    </div>
    <p class="footer-text">CLICK & GO TAXI APP © 2026</p>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD1c5lxn2ehGS_Wo5Htbkwi0gUcdpauiMg",
        authDomain: "preetytaxiapp.firebaseapp.com",
        databaseURL: "https://preetytaxiapp-default-rtdb.firebaseio.com",
        projectId: "preetytaxiapp",
        storageBucket: "preetytaxiapp.firebasestorage.app",
        messagingSenderId: "1083536462057",
        appId: "1:1083536462057:web:abcdef"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    window.switchRole = function(role) {
        const btnPasajero = document.getElementById('btn-pasajero');
        const btnConductor = document.getElementById('btn-conductor');
        const cardPasajero = document.getElementById('card-pasajero');
        const cardConductor = document.getElementById('card-conductor');

        if(btnPasajero && btnConductor && cardPasajero && cardConductor) {
            btnPasajero.classList.remove('active');
            btnConductor.classList.remove('active');
            cardPasajero.classList.remove('active');
            cardConductor.classList.remove('active');

            if(role === 'pasajero') {
                btnPasajero.classList.add('active');
                cardPasajero.classList.add('active');
            } else {
                btnConductor.classList.add('active');
                cardConductor.classList.add('active');
            }
        }
    };

    setTimeout(() => {
        const intro = document.getElementById('intro-cine');
        if(intro) {
            intro.style.pointerEvents = 'none'; 
            intro.style.opacity = '0';
            setTimeout(() => intro.remove(), 500);
        }
    }, 4000);

    // Service Worker seguro (no falla en iframe/sandbox ni file://)
    (function registrarSW() {
        try {
            if (!('serviceWorker' in navigator)) return;
            // En algunos sandbox acceder a navigator.serviceWorker lanza SecurityError
            var sw = navigator.serviceWorker;
            if (!sw || typeof sw.register !== 'function') return;

            window.addEventListener('load', function () {
                sw.register('sw.js').then(function (registration) {
                    try {
                        if (typeof firebase !== 'undefined' && firebase.messaging) {
                            var messaging = firebase.messaging();
                            messaging.getToken({
                                vapidKey: 'BBUHPimNFxcFynE28L8yDonGLzDqi8P7x2L5sKlFPpqoId-_Lkl6WURXgPHH4lTTQVtlpa_WRNO9-Sq4SSxHFn0',
                                serviceWorkerRegistration: registration
                            }).catch(function () {});
                        }
                    } catch (e) {}
                }).catch(function () {});
            });
        } catch (e) {
            // Sandbox sin allow-same-origin: ignorar, la app sigue funcionando
            console.log('Service Worker no disponible en este contexto');
        }
    })();
</script>
</body>
</html>
