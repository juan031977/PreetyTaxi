<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Trabajo - Click$GoTaxi</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #000; color: #fff; padding: 20px; transition: background 0.3s; }
        
        /* ALERTA VISUAL: Parpadeo rojo cuando llega pedido */
        @keyframes alertaFlash { 0% { background: #000; } 50% { background: #900; } 100% { background: #000; } }
        .modo-alerta { animation: alertaFlash 1s infinite; }

        #pantallaInicio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        
        .header { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 15px; border-left: 4px solid #FFC107; border: 1px solid #333; transition: 0.3s; }
        .info-row { margin: 10px 0; font-size: 16px; }
        .precio { color: #FFC107; font-size: 32px; font-weight: bold; margin: 15px 0; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 8px 0; transition: 0.2s; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; font-size: 16px; }
        label { font-size: 12px; color: #aaa; text-transform: uppercase; font-weight: bold; }
        .btn-conexion { font-size: 18px; letter-spacing: 0.5px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-iniciar { background: #28a745; color: white; }
        .btn-finalizar { background: #dc3545; color: white; }
        .btn-editar { background: #444; color: white; padding: 8px; font-size: 14px; width: auto; border-radius: 5px; margin-top: 10px; }
        .btn-historial { background: #17a2b8; color: white; padding: 8px; font-size: 14px; width: auto; border-radius: 5px; margin-top: 10px; }
        .btn-volver { position: absolute; top: 5px; left: 15px; background: transparent; color: #aaa; border: none; font-size: 14px; font-weight: bold; cursor: pointer; z-index: 20; width: auto; padding: 0; margin: 0; }

        /* Estilos del Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #1a1a1a; margin: 15% auto; padding: 20px; border: 1px solid #444; width: 90%; max-width: 400px; border-radius: 12px; position: relative; color: white; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; font-weight: bold; color: #aaa; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>
</head>
<body>

    <div id="pantallaInicio">
        <h2 style="margin-bottom: 20px;">Click$GoTaxi</h2>
        <p style="margin-bottom: 20px;">Toca el botón para activar las notificaciones sonoras</p>
        <button class="btn-iniciar" onclick="iniciarApp()" style="width: auto; padding: 20px 40px;">ACTIVAR APLICACIÓN</button>
    </div>

    <audio id="sonidoNotificacion" preload="auto">
        <source src="https://cdn.jsdelivr.net/gh/juan031977/PreetyTaxi@main/silbido.mp3" type="audio/mpeg">
        <source src="https://assets.mixkit.co/sfx/preview/2320/2320-preview.mp3" type="audio/mpeg">
    </audio>

    <button class="btn-volver" onclick="window.history.back()">⬅ Volver</button>

    <div class="header">
        <div>
            <div id="txtEstado" style="font-size: 16px;">Verificando estado...</div>
            <div style="margin-top: 5px;">Unidad: <strong id="txtUnidad" style="color: #FFC107;">Cargando...</strong></div>
            <div style="margin-top: 3px;">Conductor: <strong id="nombreConductor">Cargando...</strong></div>
            <button class="btn-editar" onclick="mostrarFormulario()">✏️ Editar mis datos</button>
            <button class="btn-historial" onclick="abrirHistorial()">📋 Ver Registros (6 días)</button>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 12px; color: #aaa;">GANANCIA HOY</div>
            <span id="ganancia" style="font-size: 18px; font-weight: bold; color: #FFC107;">B/. 0.00</span>
        </div>
    </div>

    <button id="btnConexion" class="btn-conexion" onclick="toggleConexion()">🔄 Sincronizando...</button>

    <div id="formularioDatos" class="card" style="display: none; border-left: 4px solid #007bff;">
        <h3 style="margin-bottom: 15px; color: #007bff;">Configura tus datos</h3>
        <label>Tu Nombre</label> <input type="text" id="inNombre" placeholder="Ej: Juan Pérez">
        <label>WhatsApp</label> <input type="tel" id="inTel" placeholder="Ej: 60000000">
        <label>Vehículo</label> <input type="text" id="inVehiculo" placeholder="Ej: Kia Picanto">
        <label>Color</label> <input type="text" id="inColor" placeholder="Ej: Blanco">
        <label>Placa</label> <input type="text" id="inPlaca" placeholder="Ej: AB1234">
        <button class="btn-iniciar" onclick="guardarDatos()">GUARDAR DATOS</button>
        <button style="background: #6c757d; color: white;" onclick="cerrarFormulario()">CANCELAR</button>
    </div>

    <div id="area-viajes"><div id="contenedor"></div></div>

    <div id="modalHistorial" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarHistorial()">&times;</span>
            <h3 style="margin-bottom: 15px; color: #17a2b8;">Historial de Ganancias</h3>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">Registros de los últimos 6 días:</p>
            <div id="listaHistorial" style="max-height: 300px; overflow-y: auto;">Cargando...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD1c5lxn2ehGS_Wo5Htbkwi0gUcdpauiMg", 
            databaseURL: "https://preetytaxiapp-default-rtdb.firebaseio.com/",
            projectId: "preetytaxiapp",
            messagingSenderId: "1083536462057",
            appId: "1:1083536462057:web:1a2b3c4d5e6f"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const audio = document.getElementById('sonidoNotificacion');

        function iniciarApp() {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
                document.getElementById('pantallaInicio').style.display = 'none';
            }).catch(e => alert("Por favor, permite el sonido en tu navegador"));
        }

        function reproducirSonido() {
            document.body.classList.add('modo-alerta');
            setTimeout(() => document.body.classList.remove('modo-alerta'), 3000);
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Error al reproducir:", e));
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                document.body.classList.remove('modo-alerta');
            }
        });

        let datos = JSON.parse(localStorage.getItem('datos_conductor'));
        let adminEstado = 'pendiente'; 
        let conductorConectado = localStorage.getItem('conductor_conectado') === 'true'; 
        let estoyEnViajeActivo = false;
        let intervaloReloj = null;

        if (!datos || !datos.telefono) { 
            mostrarFormulario(); 
        } else { 
            document.getElementById('nombreConductor').textContent = datos.nombre; 
            verificarReseteoDiarioYHistorial(datos.telefono);
            estatutoAdmin(datos.telefono); 
            pedirPermisoNotificaciones(datos.telefono);
        }

        // --- Obtener fecha local exacta (YYYY-MM-DD) ---
        function obtenerFechaLocal() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // --- Verificación y reseteo diario / limpieza de 6 días ---
        function verificarReseteoDiarioYHistorial(telefono) {
            const hoy = obtenerFechaLocal();
            const refConductor = db.ref('conductores/' + telefono);

            refConductor.once('value', snap => {
                const val = snap.val() || {};
                const ultimoDiaRegistrado = val.ultimoDiaRegistrado;

                if (ultimoDiaRegistrado && ultimoDiaRegistrado !== hoy) {
                    const gananciaAnterior = val.totalGeneradoHoy || 0;
                    if (gananciaAnterior > 0) {
                        db.ref(`conductores/${telefono}/historialGanancias/${ultimoDiaRegistrado}`).set({
                            fecha: ultimoDiaRegistrado,
                            total: gananciaAnterior
                        });
                    }
                    refConductor.update({
                        totalGeneradoHoy: 0,
                        ultimoDiaRegistrado: hoy
                    });
                } else if (!ultimoDiaRegistrado) {
                    refConductor.update({ ultimoDiaRegistrado: hoy });
                }

                limpiarRegistrosAntiguos(telefono);
            });
        }

        function limpiarRegistrosAntiguos(telefono) {
            const refHistorial = db.ref(`conductores/${telefono}/historialGanancias`);
            refHistorial.once('value', snap => {
                if (snap.exists()) {
                    const ahora = new Date();
                    snap.forEach(child => {
                        const [y, m, d_part] = child.key.split('-').map(Number);
                        const fechaRegistro = new Date(y, m - 1, d_part);
                        const diferenciaDias = (ahora - fechaRegistro) / (1000 * 60 * 60 * 24);
                        if (diferenciaDias > 6) {
                            child.ref.remove();
                        }
                    });
                }
            });
        }

        function abrirHistorial() {
            document.getElementById('modalHistorial').style.display = 'block';
            const contenedor = document.getElementById('listaHistorial');
            contenedor.innerHTML = "Cargando registros...";

            if (!datos || !datos.telefono) return;

            db.ref(`conductores/${datos.telefono}/historialGanancias`).once('value', snap => {
                let html = "";
                if (!snap.exists()) {
                    html = "<p style='color:#777; text-align:center;'>No hay registros anteriores guardados.</p>";
                } else {
                    let registros = [];
                    snap.forEach(child => { registros.push(child.val()); });
                    registros.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

                    registros.forEach(reg => {
                        html += `<div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333;">
                                    <span>📅 ${reg.fecha}</span>
                                    <strong style="color: #FFC107;">B/. ${parseFloat(reg.total).toFixed(2)}</strong>
                               </div>`;
                    });
                }
                contenedor.innerHTML = html;
            });
        }

        function cerrarHistorial() {
            document.getElementById('modalHistorial').style.display = 'none';
        }

        function pedirPermisoNotificaciones(telefono) {
            if ('Notification' in window) {
                Notification.requestPermission().then(perm => {
                    if(perm === 'granted') {
                        const messaging = firebase.messaging();
                        messaging.getToken({ vapidKey: 'BBUHPimNFxcFynE28L8yDonGLzDqi8P7x2L5sKlFPpqoId-_Lkl6WURXgPHH4lTTQVtlpa_WRNO9-Sq4SSxHFn0' }).then(token => {
                            if (token) {
                                db.ref('conductores/' + telefono + '/fcmToken').set(token);
                            }
                        }).catch(err => console.log('Error FCM:', err));
                    }
                });
            }
        }

        function mostrarFormulario() { 
            if (datos) {
                document.getElementById('inNombre').value = datos.nombre || '';
                document.getElementById('inTel').value = datos.telefono || '';
                document.getElementById('inVehiculo').value = datos.vehiculo || '';
                document.getElementById('inColor').value = datos.color || '';
                document.getElementById('inPlaca').value = datos.placa || '';
            }
            document.getElementById('area-viajes').style.display = 'none'; 
            document.getElementById('formularioDatos').style.display = 'block'; 
        }

        function cerrarFormulario() {
            if (!datos || !datos.telefono) return alert("Debes configurar tus datos para continuar.");
            document.getElementById('formularioDatos').style.display = 'none';
            document.getElementById('area-viajes').style.display = 'block';
        }

        function estatutoAdmin(telefono) {
            db.ref('conductores/' + telefono).on('value', snap => {
                const conductorData = snap.val();
                adminEstado = conductorData ? (conductorData.estado || 'pendiente') : 'pendiente';
                
                if (conductorData && conductorData.unidad) {
                    document.getElementById('txtUnidad').textContent = conductorData.unidad;
                } else {
                    document.getElementById('txtUnidad').textContent = "Sin Asignar";
                }

                if(conductorData && conductorData.totalGeneradoHoy !== undefined) {
                    document.getElementById('ganancia').innerText = "B/. " + parseFloat(conductorData.totalGeneradoHoy).toFixed(2);
                }
                actualizarInterfaz();
            });
        }

        function actualizarInterfaz() {
            const btnConexion = document.getElementById('btnConexion');
            if (adminEstado === 'bloqueado' || adminEstado === 'pendiente') {
                conductorConectado = false;
                document.getElementById('txtEstado').innerHTML = `<span style="color: #dc3545; font-weight: bold;">⛔ CUENTA BLOQUEADA</span>`;
                btnConexion.innerHTML = `❌ BLOQUEADO (Paga tu deuda)`;
                activarEscuchasDeViajes();
            } else {
                document.getElementById('txtEstado').innerHTML = `<span style="color: #28a745; font-weight: bold;">✅ CUENTA ACTIVA</span>`;
                if (conductorConectado) {
                    btnConexion.innerHTML = `🟢 CONECTADO (Toca para Desconectar)`;
                    activarEscuchasDeViajes();
                } else {
                    btnConexion.innerHTML = `⚪ DESCONECTADO (Modo Descanso)`;
                    document.getElementById('contenedor').innerHTML = '<div style="text-align:center; padding:35px; color:#666;">💤 Estás desconectado.</div>';
                    db.ref('viajes').off();
                }
            }
        }

        function toggleConexion() {
            if (adminEstado === 'bloqueado' || adminEstado === 'pendiente') {
                return alert("⛔ Tu cuenta está bloqueada por deuda.\nDebes pagar B/. 1.00 para poder aceptar viajes.");
            }
            conductorConectado = !conductorConectado;
            localStorage.setItem('conductor_conectado', conductorConectado);
            actualizarInterfaz();
        }

        function activarEscuchasDeViajes() {
            db.ref('viajes').off();
            document.getElementById('contenedor').innerHTML = '';
            
            if(datos && datos.telefono) {
                db.ref('viajes').orderByChild('conductorCel').equalTo(datos.telefono).on('value', (snap) => {
                    let hayViajeValido = false;
                    let viajeData = null;

                    snap.forEach((child) => {
                        const v = child.val();
                        if(['conductor_asignado', 'conductor_llego', 'viaje_iniciado'].includes(v.estado)) {
                            hayViajeValido = true;
                            estoyEnViajeActivo = true;
                            viajeData = v;
                            renderizarActivo(child.key, v);
                        }
                    });
                    
                    if (!hayViajeValido) {
                        estoyEnViajeActivo = false;
                        document.getElementById('contenedor').innerHTML = '';
                        if(intervaloReloj) clearInterval(intervaloReloj);
                    } else {
                        if(intervaloReloj) clearInterval(intervaloReloj);
                        if (viajeData && viajeData.estado === 'conductor_asignado' && viajeData.tiempoAsignacion) {
                            intervaloReloj = setInterval(() => {
                                const elReloj = document.getElementById('reloj-conductor');
                                if(elReloj) {
                                    const tiempoPasado = Date.now() - viajeData.tiempoAsignacion;
                                    const tiempoRestante = (7 * 60 * 1000) - tiempoPasado;
                                    if(tiempoRestante > 0) {
                                        const mins = Math.floor(tiempoRestante / 60000);
                                        const secs = Math.floor((tiempoRestante % 60000) / 1000);
                                        elReloj.innerText = `⏱️ Tienes ${mins}:${secs < 10 ? '0'+secs : secs} para llegar`;
                                    } else {
                                        elReloj.innerText = `🚨 TIEMPO AGOTADO. El pasajero puede cancelar.`;
                                        elReloj.style.color = '#dc3545';
                                    }
                                }
                            }, 1000);
                        }
                    }
                });
            }

            db.ref('viajes').orderByChild('estado').equalTo('pendiente').on('child_added', (snap) => {
                if (!estoyEnViajeActivo && conductorConectado) {
                    const viaje = snap.val();
                    reproducirSonido();
                    mostrarPedido(snap.key, viaje);

                    if (Notification.permission === 'granted') {
                        navigator.serviceWorker.ready.then(reg => {
                            reg.showNotification("🚕 ¡Nuevo viaje disponible!", {
                                body: `De ${viaje.origen} a ${viaje.destino} - B/. ${viaje.precio}`,
                                icon: './icon-192.png',
                                badge: './badge.png',
                                vibrate: [200,100,200],
                                requireInteraction: true,
                                tag: 'viaje-nuevo'
                            });
                        });
                    }
                }
            });

            db.ref('viajes').orderByChild('estado').equalTo('pendiente').on('child_removed', (snap) => {
                const tarj = document.getElementById('pedido_' + snap.key);
                if (tarj) tarj.remove();
            });
        }

        function mostrarPedido(id, p) {
            if(document.getElementById('pedido_' + id)) return;
            const estaBloqueado = (adminEstado === 'bloqueado' || adminEstado === 'pendiente');
            const html = `<div class="card" id="pedido_${id}">
                <div class="info-row">👤 <strong>Cliente:</strong> ${p.pasajero_nombre || 'Cliente'}</div>
                <div class="info-row">📍 <strong>Origen:</strong> ${p.origen}</div>
                <div class="info-row">🏁 <strong>Destino:</strong> ${p.destino}</div>
                <div class="precio">Total: B/. ${p.precio || "0.00"}</div>
                ${p.metodo_pago ? `<div class="info-row" style="color:#ffc107;">💰 <strong>Pago:</strong> ${p.metodo_pago.toUpperCase()}</div>` : ''}
                ${estaBloqueado ? `<button style="background:#dc3545; color:white;" disabled>⛔ BLOQUEADO - PAGA TU DEUDA</button>` : `<button style="background: #28a745; color: white;" onclick="aceptar('${id}')">✅ ACEPTAR VIAJE</button>`}
            </div>`;
            document.getElementById('contenedor').insertAdjacentHTML('beforeend', html);
        }

        window.aceptar = (id) => {
            if (adminEstado === 'bloqueado' || adminEstado === 'pendiente') return alert("❌ No puedes aceptar viajes porque tu cuenta está bloqueada.");
            const viajeRef = db.ref('viajes/' + id);
            viajeRef.transaction(currentData => {
                if (currentData && currentData.estado === 'pendiente') {
                    currentData.estado = 'conductor_asignado';
                    currentData.conductorNombre = datos.nombre;
                    currentData.conductorCel = datos.telefono;
                    currentData.conductorVehiculo = datos.vehiculo;
                    currentData.conductorColor = datos.color;
                    currentData.conductorPlaca = datos.placa;
                    currentData.tiempoAsignacion = firebase.database.ServerValue.TIMESTAMP;
                    return currentData;
                }
                return; 
            }, (error, committed) => {
                if (error) {
                    console.error('Error al aceptar el viaje:', error);
                } else if (!committed) {
                    alert("⚠️ Lo siento, este viaje ya fue tomado por otro conductor.");
                    const tarj = document.getElementById('pedido_' + id);
                    if (tarj) tarj.remove();
                }
            });
        };

        function renderizarActivo(id, v) {
            const esLlegada = v.estado === 'conductor_llego';
            let relojHtml = '';
            if (v.estado === 'conductor_asignado') {
                relojHtml = `<div id="reloj-conductor" style="text-align:center; color:#ffc107; font-weight:bold; margin-bottom:15px; font-size:16px;">⏱️ Calculando tiempo...</div>`;
            }

            let celPasajero = String(v.telefono || "").replace(/\D/g, '');
            if (celPasajero.length === 8) celPasajero = "507" + celPasajero;

            document.getElementById('contenedor').innerHTML = `
                <div class="card">
                    <div style="background:${esLlegada ? '#28a745' : '#1a1a1a'}; border: 1px solid #28a745; padding:10px; border-radius:5px; text-align:center; margin-bottom:15px; font-weight:bold; color:${esLlegada ? '#fff' : '#28a745'};">
                        ${esLlegada ? '🟢 PASAJERO NOTIFICADO (ESTADO VERDE)' : '✅ VIAJE EN CURSO'}
                    </div>
                    <div class="info-row">👤 <strong>Cliente:</strong> ${v.pasajero_nombre || 'Cliente'}</div>
                    <div class="info-row">📍 <strong>Origen:</strong> ${v.origen}</div>
                    <div class="info-row">🏁 <strong>Destino:</strong> ${v.destino}</div>
                    <div class="precio">Total: B/. ${v.precio || "0.00"}</div>
                    ${relojHtml}
                    <button style="background:${esLlegada ? '#6c757d' : '#28a745'}; color:white;" onclick="actualizar('${id}', 'conductor_llego')">${esLlegada ? '✓ PASAJERO YA NOTIFICADO' : '📍 LLEGUÉ AL PUNTO (NOTIFICAR VERDE)'}</button>
                    <button class="btn-whatsapp" onclick="window.open('https://wa.me/${celPasajero}', '_blank')">💬 WHATSAPP</button>
                    <button class="btn-iniciar" onclick="actualizar('${id}', 'viaje_iniciado')">▶️ INICIAR VIAJE</button>
                    <button class="btn-finalizar" onclick="finalizarViajeSeguro('${id}')">🏁 FINALIZAR VIAJE</button>
                </div>
            `;
        }

        window.actualizar = (id, estado) => {
            db.ref('viajes/' + id).update({ estado: estado });
        };

        window.finalizarViajeSeguro = (id) => {
            if (!datos || !datos.telefono) {
                alert("⚠️ Error: No se encontraron los datos del conductor.");
                return;
            }

            const viajeRef = db.ref('viajes/' + id);
            viajeRef.once('value', snap => {
                const viaje = snap.val();
                if (!viaje) return;
                const precioViaje = parseFloat(viaje.precio || 0);
                const hoy = obtenerFechaLocal();

                viajeRef.update({ estado: 'completado' }).then(() => {
                    // 1. Actualizar acumulado de ganancias del conductor de forma segura
                    const refConductor = db.ref('conductores/' + datos.telefono);
                    refConductor.once('value', snapCond => {
                        const actual = snapCond.val() || {};
                        const gananciaActual = parseFloat(actual.totalGeneradoHoy || 0);
                        const nuevoTotal = gananciaActual + precioViaje;
                        
                        refConductor.update({ 
                            totalGeneradoHoy: nuevoTotal,
                            ultimoDiaRegistrado: hoy
                        }).catch(err => console.error("Error actualizando perfil del conductor:", err));
                    });

                    // 2. Guardar en reportes diarios
                    db.ref(`reportes_diarios/${datos.telefono}/${hoy}/${id}`).set({
                        origen: viaje.origen || 'No especificado',
                        destino: viaje.destino || 'No especificado',
                        precio: precioViaje,
                        cliente: viaje.pasajero_nombre || 'Cliente',
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    }).catch(err => console.error("Error guardando reporte diario:", err));

                    document.getElementById('contenedor').innerHTML = '';
                    estoyEnViajeActivo = false;
                    if(intervaloReloj) clearInterval(intervaloReloj);
                }).catch(err => {
                    console.error("Error al finalizar:", err);
                    alert("No se pudo finalizar el viaje. Inténtalo de nuevo.");
                });
            });
        };
        
        function guardarDatos() {
            const tel = document.getElementById('inTel').value.replace(/[^0-9]/g, '');
            if(tel.length < 8) return alert("Número inválido");
            datos = { 
                nombre: document.getElementById('inNombre').value, 
                telefono: tel, 
                vehiculo: document.getElementById('inVehiculo').value, 
                color: document.getElementById('inColor').value, 
                placa: document.getElementById('inPlaca').value 
            };
            localStorage.setItem('datos_conductor', JSON.stringify(datos));
            db.ref('conductores/' + tel).update(datos).then(() => location.reload());
        }
    </script>
</body>
</html>
