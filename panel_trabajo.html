<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Trabajo - Click$GoTaxi</title>
    <link rel="manifest" href="./manifest.json"> 
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0b0b0b; color: #fff; padding: 20px; transition: background 0.3s; }
        
        @keyframes alertaFlash { 0% { background: #000; } 50% { background: #900; } 100% { background: #000; } }
        .modo-alerta { animation: alertaFlash 1s infinite; }
        
        @keyframes pulseAviso { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .anim-aviso { animation: pulseAviso 2s infinite; }

        #pantallaInicio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        
        .header { background: #121a1f; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a3a45; }
        .card { background: #121a1f; border-radius: 12px; padding: 20px; margin-bottom: 15px; border-left: 4px solid #2EC4E6; border: 1px solid #2a3a45; transition: 0.3s; }
        .info-row { margin: 10px 0; font-size: 16px; }
        .precio { color: #FFC107; font-size: 32px; font-weight: bold; margin: 15px 0; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 8px 0; transition: 0.2s; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #2a3a45; background: #152028; color: white; font-size: 16px; }
        label { font-size: 12px; color: #aaa; text-transform: uppercase; font-weight: bold; }
        .btn-conexion { font-size: 18px; letter-spacing: 0.5px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-iniciar { background: #28a745; color: white; }
        .btn-finalizar { background: #dc3545; color: white; }
        .btn-editar { background: #444; color: white; padding: 8px; font-size: 14px; width: auto; border-radius: 5px; margin-top: 10px; }
        .btn-volver { position: absolute; top: 5px; left: 15px; background: transparent; color: #aaa; border: none; font-size: 14px; font-weight: bold; cursor: pointer; z-index: 20; width: auto; padding: 0; margin: 0; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>
</head>
<body>

    <div id="pantallaInicio">
        <h2 style="margin-bottom: 20px; color:#2EC4E6;">Click & Go Taxi</h2>
        <p style="margin-bottom: 20px;">Toca el botón para activar las notificaciones sonoras</p>
        <button class="btn-iniciar" onclick="iniciarApp()" style="width: auto; padding: 20px 40px;">ACTIVAR APLICACIÓN</button>
    </div>

    <audio id="sonidoNotificacion" preload="auto">
        <source src="https://cdn.jsdelivr.net/gh/juan031977/PreetyTaxi@main/silbido.mp3" type="audio/mpeg">
        <source src="https://assets.mixkit.co/sfx/preview/2320/2320-preview.mp3" type="audio/mpeg">
    </audio>

    <audio id="audioLlego" preload="auto">
        <source src="https://raw.githubusercontent.com/juan031977/PreetyTaxi/main/su%20taxi%20llego.mp3" type="audio/mpeg">
    </audio>

    <button class="btn-volver" onclick="window.history.back()">⬅ Volver</button>

    <div class="header">
        <div>
            <div id="txtEstado" style="font-size: 16px;">Verificando estado...</div>
            <div style="margin-top: 5px;">Conductor: <strong id="nombreConductor">Cargando...</strong></div>
            <button class="btn-editar" onclick="mostrarFormulario()">✏️ Editar mis datos</button>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 12px; color: #aaa;">GANANCIA HOY</div>
            <span id="ganancia" style="font-size: 20px; font-weight: bold; color: #2EC4E6;">B/. 0.00</span>
            <div style="font-size: 10px; color: #777; margin-top: 2px;">Se reinicia a media noche</div>
        </div>
    </div>

    <div id="bannerAvisoGlobal" class="anim-aviso" style="display: none; background: #FFC107; color: #0b0b0b; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #b38600;">
        📢 <span id="textoAvisoGlobal"></span>
    </div>

    <button id="btnConexion" class="btn-conexion" onclick="toggleConexion()">🔄 Sincronizando...</button>

    <div class="card" id="tarjetaHistorial" style="display: none; padding: 15px; border-left: 4px solid #2EC4E6;">
        <h4 style="margin-bottom: 10px; color: #2EC4E6;">📅 Historial de Ganancias</h4>
        <div id="contenedorHistorial6Dias"></div>
    </div>

    <div id="formularioDatos" class="card" style="display: none; border-left: 4px solid #2EC4E6;">
        <h3 style="margin-bottom: 10px; color: #2EC4E6;">✏️ Editar mis datos</h3>
        <label>Tu Nombre</label> <input type="text" id="inNombre" placeholder="Ej: Juan Pérez">
        <label>WhatsApp (celular)</label> <input type="tel" id="inTel" placeholder="Ej: 60000000">
        <label>Correo electrónico</label> <input type="email" id="inEmail" placeholder="Ej: conductor@email.com">
        <label>Vehículo</label> <input type="text" id="inVehiculo" placeholder="Ej: Kia Picanto">
        <label>Color</label> <input type="text" id="inColor" placeholder="Ej: Blanco">
        <label>Placa</label> <input type="text" id="inPlaca" placeholder="Ej: AB1234">
        <button class="btn-iniciar" onclick="guardarDatos()">GUARDAR DATOS</button>
        <button type="button" onclick="document.getElementById('formularioDatos').style.display='none'; document.getElementById('area-viajes').style.display='block';" style="background:#333;color:#ccc;margin-top:8px;">Cancelar</button>
    </div>

    <div id="area-viajes"><div id="contenedor"></div></div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD1c5lxn2ehGS_Wo5Htbkwi0gUcdpauiMg", 
            databaseURL: "https://preetytaxiapp-default-rtdb.firebaseio.com/",
            projectId: "preetytaxiapp",
            messagingSenderId: "1083536462057",
            appId: "1:1083536462057:web:1a2b3c4d5e6f"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const audio = document.getElementById('sonidoNotificacion');
        const audioLlego = document.getElementById('audioLlego');

        let datos = JSON.parse(localStorage.getItem('datos_conductor'));
        let adminEstado = 'pendiente'; 
        let conductorConectado = false; 
        let estoyEnViajeActivo = false;
        let intervaloReloj = null;
        let listenerNuevoViaje = null;

        function iniciarApp() {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
                document.getElementById('pantallaInicio').style.display = 'none';
            }).catch(e => alert("Por favor, permite el sonido en tu navegador"));
        }

        function reproducirSonido() {
            document.body.classList.add('modo-alerta');
            setTimeout(() => document.body.classList.remove('modo-alerta'), 3000);
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Error al reproducir:", e));
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                document.body.classList.remove('modo-alerta');
            }
        });

        function escucharAvisoGlobal() {
            db.ref('sistema/aviso_global').on('value', snap => {
                const aviso = snap.val();
                const banner = document.getElementById('bannerAvisoGlobal');
                const texto = document.getElementById('textoAvisoGlobal');
                if (aviso && aviso.activo && aviso.texto) {
                    texto.innerText = aviso.texto;
                    banner.style.display = 'block';
                } else {
                    banner.style.display = 'none';
                    texto.innerText = '';
                }
            });
        }

        function obtenerFechaHoy() {
            const tzoffset = (new Date()).getTimezoneOffset() * 60000;
            return (new Date(Date.now() - tzoffset)).toISOString().slice(0, 10);
        }

        function obtenerNombreDia(fechaStr) {
            const partes = fechaStr.split('-');
            const fecha = new Date(partes[0], partes[1] - 1, partes[2]);
            const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            return dias[fecha.getDay()] + ' (' + fechaStr.substring(5) + ')';
        }

        function verificarReseteoDiario(telefono) {
            const fechaHoy = obtenerFechaHoy();
            const refConductor = db.ref('conductores/' + telefono);

            refConductor.once('value', snapshot => {
                const conductorInfo = snapshot.val() || {};
                const ultimaFecha = conductorInfo.ultimoDiaRegistrado || fechaHoy;
                const generadoHoy = parseFloat(conductorInfo.totalGeneradoHoy || 0);

                if (ultimaFecha !== fechaHoy) {
                    if (generadoHoy > 0) {
                        db.ref('reportes_diarios/' + telefono + '/' + ultimaFecha).transaction(dia => {
                            if (!dia) dia = {};
                            dia.total = generadoHoy;
                            dia.fecha = ultimaFecha;
                            dia.diaNombre = obtenerNombreDia(ultimaFecha);
                            return dia;
                        });
                    }
                    refConductor.update({ totalGeneradoHoy: 0, ultimoDiaRegistrado: fechaHoy });
                } else if (!conductorInfo.ultimoDiaRegistrado) {
                    refConductor.update({ ultimoDiaRegistrado: fechaHoy });
                }
            });
        }

        function cargarHistorial6Dias(telefono) {
            const refReportes = db.ref('reportes_diarios/' + telefono);
            const divHistorial = document.getElementById('contenedorHistorial6Dias');
            const tarjetaHistorial = document.getElementById('tarjetaHistorial');

            refReportes.limitToLast(6).on('value', snapshot => {
                let html = '';
                let totalSemana = 0;
                const dias = [];

                if (!snapshot.exists()) {
                    html += '<p style="color:#aaa; font-size:13px; text-align:center;">Aún no hay reportes de días anteriores.</p>';
                } else {
                    snapshot.forEach(childSnapshot => {
                        const reporte = childSnapshot.val() || {};
                        let totalDia = parseFloat(reporte.total || 0);
                        if (!totalDia && reporte.viajes) {
                            Object.values(reporte.viajes).forEach(v => { totalDia += parseFloat(v.precio || 0); });
                        }
                        if (totalDia > 0 || reporte.fecha || reporte.diaNombre) {
                            dias.push({ nombre: reporte.diaNombre || reporte.fecha || childSnapshot.key, total: totalDia });
                            totalSemana += totalDia;
                        }
                    });
                    dias.reverse();
                    html += '<div style="display:flex; flex-direction:column; gap:8px;">';
                    dias.forEach(d => {
                        html += `<div style="background:#222; padding:10px; border-radius:8px; display:flex; justify-content: space-between; align-items:center;"><span style="color:#ddd; font-size:14px;">${d.nombre}</span><span style="color:#28a745; font-weight:bold;">B/. ${d.total.toFixed(2)}</span></div>`;
                    });
                    html += '</div>';
                    html += `<p style="margin-top:10px; color:#fff; font-size:15px; text-align:right;"><b>Total últimos 6 días:</b> B/. ${totalSemana.toFixed(2)}</p>`;
                }
                if (divHistorial) {
                    divHistorial.innerHTML = html;
                    tarjetaHistorial.style.display = 'block';
                }
            });
        }

        if (!datos || !datos.telefono) { 
            mostrarFormulario(); 
        } else { 
            document.getElementById('nombreConductor').textContent = datos.nombre; 
            verificarReseteoDiario(datos.telefono); 
            cargarHistorial6Dias(datos.telefono);   
            escucharEstadoConductor(datos.telefono); 
            pedirPermisoNotificaciones(datos.telefono); 
            escucharAvisoGlobal();
        }

        function pedirPermisoNotificaciones(telefono) {
            if ('Notification' in window) {
                Notification.requestPermission().then(perm => {
                    if(perm === 'granted') {
                        const messaging = firebase.messaging();
                        messaging.getToken({ vapidKey: 'BBUHPimNFxcFynE28L8yDonGLzDqi8P7x2L5sKlFPpqoId-_Lkl6WURXgPHH4lTTQVtlpa_WRNO9-Sq4SSxHFn0' }).then(token => {
                            if (token) db.ref('conductores/' + telefono + '/fcmToken').set(token);
                        }).catch(err => console.log('Error FCM:', err));
                    }
                });
            }
        }

        function mostrarFormulario() { 
            document.getElementById('area-viajes').style.display = 'none'; 
            document.getElementById('formularioDatos').style.display = 'block';
            try {
                const d = datos || JSON.parse(localStorage.getItem('datos_conductor') || '{}');
                if (d) {
                    if (d.nombre) document.getElementById('inNombre').value = d.nombre;
                    if (d.telefono) document.getElementById('inTel').value = d.telefono;
                    if (d.vehiculo) document.getElementById('inVehiculo').value = d.vehiculo;
                    if (d.color) document.getElementById('inColor').value = d.color;
                    if (d.placa) document.getElementById('inPlaca').value = d.placa;
                    if (d.email) document.getElementById('inEmail').value = d.email;
                }
            } catch (e) {}
        }

        // Sincroniza el estado desde Firebase para mantenerlo seguro
        function escucharEstadoConductor(telefono) {
            db.ref('conductores/' + telefono).on('value', snap => {
                const conductorData = snap.val() || {};
                adminEstado = conductorData.estado || 'pendiente';
                
                // Si la base de datos dice expresamente true, está conectado; sino, desconectado por defecto
                conductorConectado = (conductorData.enServicio === true);

                if(conductorData) {
                    document.getElementById('ganancia').innerText = "B/. " + parseFloat(conductorData.totalGeneradoHoy || 0).toFixed(2);
                }
                actualizarInterfaz();
            });
        }

        function actualizarInterfaz() {
            const btnConexion = document.getElementById('btnConexion');
            
            if (adminEstado === 'bloqueado' || adminEstado === 'pendiente') {
                conductorConectado = false;
                db.ref('conductores/' + datos.telefono + '/enServicio').set(false);
                document.getElementById('txtEstado').innerHTML = `<span style="color: #dc3545; font-weight: bold;">⛔ CUENTA RESTRINGIDA</span>`;
                btnConexion.innerHTML = `❌ CUENTA INACTIVA / PENDIENTE`;
            } else {
                document.getElementById('txtEstado').innerHTML = `<span style="color: #28a745; font-weight: bold;">✅ CUENTA ACTIVA</span>`;
                if (conductorConectado) {
                    btnConexion.innerHTML = `🟢 CONECTADO (Toca para Desconectar)`;
                } else {
                    btnConexion.innerHTML = `⚪ DESCONECTADO (Fuera de Servicio)`;
                }
            }
            
            gestionarEscuchasDeViajes(); 
        }

        function toggleConexion() {
            if (adminEstado === 'bloqueado' || adminEstado === 'pendiente') {
                return alert("⛔ Tu cuenta se encuentra en revisión o pendiente de activación por el administrador.");
            }
            // Cambia el estado directamente en Firebase
            const nuevoEstado = !conductorConectado;
            db.ref('conductores/' + datos.telefono).update({ enServicio: nuevoEstado });
        }

        function gestionarEscuchasDeViajes() {
            // 1. Apagamos cualquier escucha previa de viajes nuevos para evitar duplicados o fugas
            if (listenerNuevoViaje) {
                db.ref('viajes').orderByChild('estado').equalTo('pendiente').off('child_added', listenerNuevoViaje);
                listenerNuevoViaje = null;
            }

            // 2. Escuchar siempre los viajes propios activos (por si se desconectó accidentalmente a mitad de un viaje)
            if(datos && datos.telefono) {
                db.ref('viajes').orderByChild('conductorCel').equalTo(datos.telefono).on('value', (snap) => {
                    let hayViajeValido = false;
                    let viajeData = null;

                    snap.forEach((child) => {
                        const v = child.val();
                        if(['conductor_asignado', 'conductor_llego', 'viaje_iniciado'].includes(v.estado)) {
                            hayViajeValido = true;
                            estoyEnViajeActivo = true;
                            viajeData = v;
                            renderizarActivo(child.key, v);
                        }
                    });
                    
                    if (!hayViajeValido) {
                        estoyEnViajeActivo = false;
                        if(intervaloReloj) clearInterval(intervaloReloj);
                        
                        if (!conductorConectado) {
                            document.getElementById('contenedor').innerHTML = '<div style="text-align:center; padding:35px; color:#666;">💤 Estás fuera de servicio.<br>No recibirás alertas ni viajes nuevos.</div>';
                        } else {
                            document.getElementById('contenedor').innerHTML = '<div style="text-align:center; padding:35px; color:#2EC4E6;">🟢 Estás en línea. Buscando viajes cercanos...</div>';
                        }
                    } else {
                        if(intervaloReloj) clearInterval(intervaloReloj);
                        if (viajeData && viajeData.estado === 'conductor_asignado' && viajeData.tiempoAsignacion) {
                            intervaloReloj = setInterval(() => {
                                const elReloj = document.getElementById('reloj-conductor');
                                if(elReloj) {
                                    const tiempoPasado = Date.now() - viajeData.tiempoAsignacion;
                                    const tiempoRestante = (7 * 60 * 1000) - tiempoPasado;
                                    if(tiempoRestante > 0) {
                                        const mins = Math.floor(tiempoRestante / 60000);
                                        const secs = Math.floor((tiempoRestante % 60000) / 1000);
                                        elReloj.innerText = `⏱️ Tienes ${mins}:${secs < 10 ? '0'+secs : secs} para llegar`;
                                    } else {
                                        elReloj.innerText = `🚨 TIEMPO AGOTADO. El pasajero puede cancelar.`;
                                        elReloj.style.color = '#dc3545';
                                    }
                                }
                            }, 1000);
                        }
                    }
                });
            }

            // 3. SOLO SI ESTÁ CONECTADO, activamos la escucha de nuevos viajes pendientes
            if (conductorConectado && adminEstado !== 'bloqueado' && adminEstado !== 'pendiente') {
                listenerNuevoViaje = (snap) => {
                    // Doble validación de seguridad estricta
                    if (!conductorConectado) return; 
                    
                    if (!estoyEnViajeActivo) {
                        const viaje = snap.val();
                        reproducirSonido();
                        mostrarPedido(snap.key, viaje);

                        if (Notification.permission === 'granted') {
                            navigator.serviceWorker.ready.then(reg => {
                                reg.showNotification("🚕 ¡Nuevo viaje disponible!", {
                                    body: `De ${viaje.origen} a ${viaje.destino} - B/. ${viaje.precio}`,
                                    icon: './icon-192.png',
                                    badge: './badge.png', 
                                    vibrate: [200,100,200],
                                    requireInteraction: true,
                                    tag: 'viaje-nuevo'
                                });
                            });
                        }
                    }
                };

                db.ref('viajes').orderByChild('estado').equalTo('pendiente').on('child_added', listenerNuevoViaje);

                db.ref('viajes').orderByChild('estado').equalTo('pendiente').on('child_removed', (snap) => {
                    const tarj = document.getElementById('pedido_' + snap.key);
                    if (tarj) tarj.remove();
                });
            }
        }

        function mostrarPedido(id, p) {
            if(document.getElementById('pedido_' + id)) return;
            // Si por alguna razón extraña se abrió la tarjeta pero está desconectado, la borramos de inmediato
            if(!conductorConectado) return;

            const estaBloqueado = (adminEstado === 'bloqueado' || adminEstado === 'pendiente');
            const fotoP = p.foto_pasajero || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
            const html = `<div class="card" id="pedido_${id}">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
                    <img src="${fotoP}" alt="Cliente" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #2EC4E6;background:#111;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
                    <div class="info-row" style="margin:0;">👤 <strong>Cliente:</strong> ${p.pasajero_nombre || 'Cliente'}</div>
                </div>
                <div class="info-row">📍 <strong>Origen:</strong> ${p.origen}</div>
                <div class="info-row">🏁 <strong>Destino:</strong> ${p.destino}</div>
                <div class="precio">Total: B/. ${p.precio || "0.00"}</div>
                ${p.metodo_pago ? `<div class="info-row" style="color:#ffc107;">💰 <strong>Pago:</strong> ${p.metodo_pago.toUpperCase()}</div>` : ''}
                ${estaBloqueado ? `<button style="background:#dc3545; color:white;" disabled>⛔ CUENTA INACTIVA</button>` : `<button style="background: #28a745; color: white;" onclick="aceptar('${id}')">✅ ACEPTAR VIAJE</button>`}
            </div>`;
            document.getElementById('contenedor').insertAdjacentHTML('beforeend', html);
        }

        window.aceptar = (id) => {
            if (!conductorConectado) {
                alert("❌ Estás fuera de servicio. No puedes aceptar viajes.");
                return;
            }
            if (adminEstado === 'bloqueado' || adminEstado === 'pendiente') return alert("❌ No puedes aceptar viajes hasta que tu cuenta sea activada.");
            
            db.ref('viajes/' + id).update({
                estado: 'conductor_asignado',
                conductorNombre: datos.nombre,
                conductorCel: datos.telefono,
                conductorVehiculo: datos.vehiculo,
                conductorColor: datos.color,
                conductorPlaca: datos.placa,
                tiempoAsignacion: firebase.database.ServerValue.TIMESTAMP
            });
        };

        function renderizarActivo(id, v) {
            const esLlegada = v.estado === 'conductor_llego';
            let relojHtml = '';
            if (v.estado === 'conductor_asignado') {
                relojHtml = `<div id="reloj-conductor" style="text-align:center; color:#ffc107; font-weight:bold; margin-bottom:15px; font-size:16px;">⏱️ Calculando tiempo...</div>`;
            }

            let celPasajero = String(v.telefono || "").replace(/\D/g, '');
            if (celPasajero.length === 8) celPasajero = "507" + celPasajero;

            document.getElementById('contenedor').innerHTML = `
                <div class="card">
                    <div style="background:${esLlegada ? '#28a745' : '#1a1a1a'}; border: 1px solid #28a745; padding:10px; border-radius:5px; text-align:center; margin-bottom:15px; font-weight:bold; color:${esLlegada ? '#fff' : '#28a745'};">
                        ${esLlegada ? '🟢 PASAJERO NOTIFICADO (ESTADO VERDE)' : '✅ VIAJE EN CURSO'}
                    </div>
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
                        <img src="${v.foto_pasajero || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" alt="Cliente" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #2EC4E6;background:#111;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
                        <div class="info-row" style="margin:0;">👤 <strong>Cliente:</strong> ${v.pasajero_nombre || 'Cliente'}</div>
                    </div>
                    <div class="info-row">📍 <strong>Origen:</strong> ${v.origen}</div>
                    <div class="info-row">🏁 <strong>Destino:</strong> ${v.destino}</div>
                    <div class="precio">Total: B/. ${v.precio || "0.00"}</div>
                    ${relojHtml}
                    <button style="background:${esLlegada ? '#6c757d' : '#007bff'}; color:white;" onclick="actualizar('${id}', 'conductor_llego')">${esLlegada ? '✓ PASAJERO YA NOTIFICADO' : '📍 LLEGUÉ AL PUNTO (NOTIFICAR VERDE)'}</button>
                    <button class="btn-whatsapp" onclick="window.open('https://wa.me/${celPasajero}', '_blank')">💬 WHATSAPP</button>
                    <button class="btn-iniciar" onclick="actualizar('${id}', 'viaje_iniciado')">▶️ INICIAR VIAJE</button>
                    <button class="btn-finalizar" onclick="finalizarViajeSeguro('${id}')">🏁 FINALIZAR VIAJE</button>
                </div>
            `;
        }

        window.actualizar = (id, estado) => {
            if (estado === 'conductor_llego') {
                if (audioLlego) {
                    audioLlego.currentTime = 0;
                    audioLlego.play().catch(e => console.log("Error al reproducir audio llegó:", e));
                }
            }
            db.ref('viajes/' + id).update({ estado: estado });
        };

        window.finalizarViajeSeguro = (id) => {
            if(!confirm("¿Estás seguro que deseas finalizar este viaje y registrar la ganancia completa?")) return;
            
            const viajeRef = db.ref('viajes/' + id);
            viajeRef.once('value', snap => {
                const viaje = snap.val();
                if (!viaje) return alert("El viaje ya no existe o fue cancelado.");
                
                let precioViaje = 0;
                if (viaje.precio_numerico !== undefined && viaje.precio_numerico !== null) {
                    precioViaje = parseFloat(viaje.precio_numerico) || 0;
                } else {
                    const precioLimpioStr = String(viaje.precio || "0").replace(/[^0-9.]/g, '');
                    precioViaje = parseFloat(precioLimpioStr) || 0;
                }
                
                const updatesViaje = { estado: 'completado' };
                if (!viaje.precio_numerico) updatesViaje.precio_numerico = precioViaje;
                
                const hoy = obtenerFechaHoy();

                viajeRef.update(updatesViaje).then(() => {
                    document.getElementById('contenedor').innerHTML = '';
                    estoyEnViajeActivo = false;
                    if(intervaloReloj) clearInterval(intervaloReloj);

                    const refConductor = db.ref('conductores/' + datos.telefono);
                    refConductor.transaction(actual => {
                        if (!actual) actual = {};
                        const gananciaActual = parseFloat(actual.totalGeneradoHoy || 0);
                        actual.totalGeneradoHoy = gananciaActual + precioViaje; 
                        actual.ultimoDiaRegistrado = hoy;
                        return actual;
                    });

                    db.ref(`reportes_diarios/${datos.telefono}/${hoy}/viajes/${id}`).set({
                        origen: viaje.origen || 'No especificado',
                        destino: viaje.destino || 'No especificado',
                        precio: precioViaje,
                        cliente: viaje.pasajero_nombre || 'Cliente',
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });

                    db.ref(`reportes_diarios/${datos.telefono}/${hoy}`).transaction(dia => {
                        if (!dia) dia = {};
                        const totalActual = parseFloat(dia.total || 0);
                        dia.total = totalActual + precioViaje;
                        dia.fecha = hoy;
                        dia.diaNombre = obtenerNombreDia(hoy);
                        return dia;
                    });
                    
                    actualizarInterfaz();
                }).catch(err => {
                    console.error("Error al finalizar:", err);
                    alert("No se pudo finalizar el viaje. Inténtalo de nuevo.");
                });
            });
        };
        
        function guardarDatos() {
            const telNuevo = document.getElementById('inTel').value.replace(/[^0-9]/g, '');
            if (telNuevo.length < 8) return alert("Número inválido");

            const nombre = (document.getElementById('inNombre').value || '').trim();
            const vehiculo = document.getElementById('inVehiculo').value || '';
            const color = document.getElementById('inColor').value || '';
            const placa = document.getElementById('inPlaca').value || '';
            const email = (document.getElementById('inEmail').value || '').trim();
            if (!nombre) return alert("Escribe tu nombre");

            const telAnterior = (datos && datos.telefono) ? String(datos.telefono).replace(/[^0-9]/g, '') : '';
            const basicos = { nombre: nombre, telefono: telNuevo, celular: telNuevo, email: email, vehiculo: vehiculo, color: color, placa: placa };

            if (!telAnterior || telAnterior === telNuevo) {
                datos = Object.assign({}, datos || {}, basicos);
                localStorage.setItem('datos_conductor', JSON.stringify(datos));
                return db.ref('conductores/' + telNuevo).update(basicos).then(() => {
                    alert("✅ Datos guardados");
                    location.reload();
                });
            }

            if (!confirm("Vas a cambiar el celular de " + telAnterior + " a " + telNuevo + ".\n\nSe migrarán estrellas, deuda, reportes y ganancias.\n¿Continuar?")) return;

            db.ref('conductores/' + telNuevo).once('value').then(snapNuevo => {
                if (snapNuevo.exists()) {
                    alert("Ese número ya está registrado como conductor.");
                    return null;
                }
                return db.ref('conductores/' + telAnterior).once('value');
            }).then(snapViejo => {
                if (!snapViejo) return;
                const viejo = snapViejo.val() || {};
                const migrado = Object.assign({}, viejo, basicos, {
                    telefono_anterior: telAnterior,
                    migrado_en: new Date().toISOString()
                });

                return db.ref('conductores/' + telNuevo).set(migrado).then(() => {
                    return db.ref('reportes_diarios/' + telAnterior).once('value').then(repSnap => {
                        const updates = {};
                        if (repSnap.exists()) {
                            updates['reportes_diarios/' + telNuevo] = repSnap.val();
                            updates['reportes_diarios/' + telAnterior] = null;
                        }
                        return db.ref('viajes').orderByChild('conductorCel').equalTo(telAnterior).once('value').then(vSnap => {
                            if (vSnap.exists()) {
                                vSnap.forEach(ch => {
                                    updates['viajes/' + ch.key + '/conductorCel'] = telNuevo;
                                    updates['viajes/' + ch.key + '/conductorNombre'] = nombre;
                                });
                            }
                            updates['conductores/' + telAnterior] = null;
                            return db.ref().update(updates);
                        });
                    });
                }).then(() => {
                    datos = Object.assign({}, migrado, basicos);
                    localStorage.setItem('datos_conductor', JSON.stringify({
                        nombre: nombre, telefono: telNuevo, email: email, vehiculo: vehiculo, color: color, placa: placa
                    }));
                    alert("✅ Número actualizado.");
                    location.reload();
                });
            }).catch(err => {
                console.error(err);
                alert("Error al migrar: " + (err.message || "intenta de nuevo"));
            });
        }
    </script>
</body>
</html>
